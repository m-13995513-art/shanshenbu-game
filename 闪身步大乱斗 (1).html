<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>闪身步大乱斗</title>
<style>
:root{--ink:#1b1a22;--paper:#fffdf2;--orange:#f2602a;--yellow:#ffe14a;--sky:#6aaee3}
html,body{height:100%;margin:0}
body{background:#14202e;color:#fff;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;user-select:none;-webkit-user-select:none}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0f1822;border-radius:10px;overflow:hidden;margin-top:6px}
#c{width:100%;height:100%;object-fit:contain;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(14,24,36,.6);text-align:center;padding:16px;box-sizing:border-box}
.overlay[hidden]{display:none!important}
h1{margin:0;font-size:clamp(34px,8vw,84px);font-weight:900;color:#ffe14a;-webkit-text-stroke:2px #1b1a22;text-shadow:0 6px 0 #f2602a,0 10px 0 #1b1a22;letter-spacing:.04em}
.sub{font-size:clamp(16px,3vw,26px);font-weight:900;color:#fff;letter-spacing:.2em;text-shadow:0 2px 0 #1b1a22}
.big{font-size:clamp(20px,4vw,34px);font-weight:900;color:#fff;text-shadow:0 3px 0 #1b1a22}
.btn{font:inherit;font-weight:900;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:none;padding:10px 18px;min-height:44px}
.btn:active,.btn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.cool{opacity:.45}
.btn.hero{background:var(--orange);color:#fff;font-size:clamp(20px,4vw,30px);padding:14px 36px;text-shadow:0 2px 0 var(--ink)}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-width:min(300px,80vw)}
.panel h2{margin:0 0 4px;font-size:22px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:900;font-size:18px}
.gear{position:absolute;top:8px;right:8px;z-index:5;width:44px;height:44px;padding:0;font-size:22px;border-radius:12px}
#controls{display:flex;gap:8px;height:27vh;min-height:118px;max-height:210px;padding:8px 0 10px;box-sizing:border-box}
.side{flex:0 0 22%;font-size:clamp(16px,2.8vh,24px)}
.skills{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px}
.skills .btn{font-size:clamp(13px,2.3vh,19px);padding:4px 6px;min-height:0}
.k{display:block;font-size:.7em;opacity:.6;font-weight:700}
.diff{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.diff .btn{padding:6px 14px;min-height:42px;font-size:clamp(14px,2.6vw,18px)}.btn.on{background:var(--orange);color:#fff;text-shadow:0 1px 0 var(--ink)}
.b-kick{background:#ffd34d}.b-bear{background:#ffb08a}.b-wob{background:#c9f0c0}.b-mud{background:#d7c4a0}.b-bask{background:#b8e2ff}.b-sp{background:#ff9ee0}
#rotate{display:none}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
#rotate{position:fixed;inset:0;background:#14202e;z-index:99;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-align:center;padding:24px}
</style>
<div id="app">
  <div id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <button class="btn gear" id="gear" aria-label="设置">⚙</button>

    <div class="overlay" id="menu">
      <h1>闪身步大乱斗</h1>
      <div class="sub">玩家 VS AI</div>
      <div class="sub" style="font-size:14px;letter-spacing:.1em">AI 难度</div>
      <div class="diff"><button class="btn" data-diff="0">简单</button><button class="btn" data-diff="1">中等</button><button class="btn" data-diff="2">困难</button><button class="btn" data-diff="3">超级困难</button></div>
      <button class="btn hero" id="startBtn">开始对决</button>
      <div class="big" style="font-size:16px;opacity:.85">键盘：A/D 闪身 · J 踢球 · K 哆嗦毛 · L 摇头 · U 拔泥 · I 簸箕 · 空格 特殊</div>
    </div>

    <div class="overlay" id="end" hidden>
      <div class="big" id="endTitle" style="font-size:clamp(40px,9vw,90px);color:#ffe14a">YOU WIN!</div>
      <div class="big" id="endSub">闪身步之王！</div>
      <div class="diff"><button class="btn" data-diff="0">简单</button><button class="btn" data-diff="1">中等</button><button class="btn" data-diff="2">困难</button><button class="btn" data-diff="3">超级困难</button></div>
      <button class="btn hero" id="againBtn">再来一次</button>
    </div>

    <div class="overlay" id="settings" hidden>
      <div class="panel">
        <h2>设置</h2>
        <div class="row"><span>音乐</span><button class="btn" data-opt="music">ON</button></div>
        <div class="row"><span>音效</span><button class="btn" data-opt="sfx">ON</button></div>
        <div class="row"><span>语音</span><button class="btn" data-opt="voice">ON</button></div>
        <button class="btn" id="closeSettings">关闭</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn side" data-key="dodgeL" aria-label="闪 ←">← 闪身</button>
    <div class="skills">
      <button class="btn b-kick" data-key="kick">⚽ 浪子踢球<span class="k">J</span></button>
      <button class="btn b-bear" data-key="bear">🐻 哆嗦毛<span class="k">K</span></button>
      <button class="btn b-wob" data-key="wobble">🧠 摇头晃脑<span class="k">L</span></button>
      <button class="btn b-mud" data-key="mud">👣 拔泥步<span class="k">U</span></button>
      <button class="btn b-bask" data-key="shuffle">🧺 簸箕步<span class="k">I</span></button>
      <button class="btn b-sp" data-key="special">✦ 特殊<span class="k">空格</span></button>
    </div>
    <button class="btn side" data-key="dodgeR" aria-label="闪 →">闪身 →</button>
  </div>
</div>
<div id="rotate">请把手机横过来玩 ↻</div>

// 音频：全部用 WebAudio 程序化合成，无需外部文件。
const Snd = (() => {
  let ctx = null, master = null;
  const opt = { music: true, sfx: true, voice: true };
  let musicTimer = null, step = 0, bpm = 150;
  const buffers = {};
  let loaded = false, cur = null;

  // 解码从参考视频中提取的原声片段（base64 mp3 → AudioBuffer）
  function loadClips() {
    if (loaded || !ctx || typeof VOICE_CLIPS === 'undefined') return;
    loaded = true;
    for (const k in VOICE_CLIPS) {
      try {
        const bin = atob(VOICE_CLIPS[k].split(',')[1]);
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const p = ctx.decodeAudioData(u8.buffer, b => { buffers[k] = b; }, () => {});
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
  }
  // force=true：玩家的原声立即打断当前语音；否则只在没有语音时播放（AI）
  function playClip(name, vol = 1, force = false) {
    if (!ctx || !opt.voice || !buffers[name]) return false;
    if (cur && !force) return false;
    if (cur) { try { cur.stop(); } catch (e) {} }
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buffers[name];
    g.gain.value = 0.85 * vol;
    src.connect(g); g.connect(master);
    src.onended = () => { if (cur === src) cur = null; };
    cur = src;
    src.start();
    return true;
  }

  function init() {
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.7;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      loadClips();
    } catch (e) { ctx = null; }
  }

  function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, when = 0) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(dur, vol = 0.2, freq = 1200, sweep = 0, when = 0, q = 1) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (sweep) f.frequency.exponentialRampToValueAtTime(freq + sweep, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  // 具体音效（对应设计文档）
  function sfx(name) {
    if (!ctx || !opt.sfx) return;
    switch (name) {
      case 'kick':   noise(0.05, 0.5, 2500); tone(180, 0.08, 'triangle', 0.3, -60); break;     // 啪！
      case 'whoosh': noise(0.35, 0.35, 400, 2400, 0, 0.8); break;                               // 咻——！ / 闪身 咻！
      case 'hit':    tone(140, 0.25, 'sine', 0.8, -90); noise(0.12, 0.4, 600); break;           // 砰！
      case 'perfect':tone(1320, 0.35, 'sine', 0.25); tone(1760, 0.5, 'sine', 0.15, 0, 0.05); break; // 叮！
      case 'bear':   for (let i = 0; i < 6; i++) noise(0.03, 0.4, 3000, 0, i * 0.045, 2); break; // 哒哒哒！
      case 'boom':   tone(90, 0.6, 'sine', 0.9, -60); noise(0.5, 0.6, 300, -200); break;         // 轰！
      case 'stomp':  tone(70, 0.22, 'sine', 0.9, -30); noise(0.1, 0.35, 220); break;              // 咚！
      case 'shuffle':for (let i = 0; i < 8; i++) noise(0.025, 0.3, 3500, 0, i * 0.03, 3); break; // 哒哒哒哒！
      case 'win':    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.18, 0, i * 0.12)); break;
      case 'lose':   [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.25, 0, i * 0.18)); break;
      case 'ready':  tone(660, 0.12, 'square', 0.2); break;
      case 'go':     tone(990, 0.4, 'square', 0.25); tone(1480, 0.4, 'square', 0.15, 0, 0.02); break;
      case 'tick':   tone(520, 0.1, 'square', 0.2); break;
    }
  }

  // 背景音乐：鼓点 + 偏民间的五声音阶旋律（唢呐感用方波模拟）
  const MELODY = [0, 2, 4, 2, 0, -1, 0, 2, 4, 5, 4, 2, 0, 2, 1, 0];
  const BASE = 261.6; // C4
  const semi = n => BASE * Math.pow(2, [0, 2, 4, 7, 9][((n % 5) + 5) % 5] / 12 + Math.floor(n / 5));
  function musicTick() {
    if (!ctx || !opt.music) { step++; return; }
    const s = step % 16;
    if (s % 4 === 0) tone(120, 0.12, 'sine', 0.8, -50);          // 大鼓
    if (s === 4 || s === 12) noise(0.1, 0.5, 1800);               // 军鼓
    noise(0.03, 0.12, 7000);                                       // 踩镲
    if (s % 2 === 1) tone(semi(MELODY[(step >> 1) % 16]) * 2, 0.12, 'square', 0.04); // 旋律
    step++;
  }
  function startMusic() {
    stopMusic();
    step = 0;
    musicTimer = setInterval(musicTick, 60000 / bpm / 4);
  }
  function stopMusic() { if (musicTimer) clearInterval(musicTimer); musicTimer = null; }
  function setIntensity(combo) {
    const nb = 150 + Math.min(combo, 20) * 2.5;
    if (Math.abs(nb - bpm) > 1) {

      if (musicTimer) startMusic();

  }

  // 原创短语音：使用浏览器自带中文语音合成（不模仿真人），不可用时仅显示字幕
  function speak(text) {
    if (!opt.voice) return;

      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 1.25; u.pitch = 1.4; u.volume = 0.9;

  return {
    init, sfx, speak, playClip, opt, startMusic, stopMusic, setIntensity,

  };
})();
// 绘制：参考视频的蓝色舞台（蓝色墙面、竖向接缝、反光地面）+ 原创 2D 角色
const Draw = (() => {
  const W = 1280, H = 720, GROUND = 575;
  const FH = { thigh: 62, shin: 60, torso: 66, upper: 44, fore: 40, head: 24 };

  // 角色配色：玩家（白 V 领短袖 + 卡其裤），AI（灰色花纹短袖 + 深色裤）
  const PAL = {
    p: { tee: '#f6f5ef', trim: '#2b3a55', pants: '#c8b48e', skin: '#e9b993', hair: '#2a2420', shoe: '#2c2622' },
    a: { tee: '#9aa9b2', trim: '#5f6f7a', pants: '#2e2f3a', skin: '#d8a07a', hair: '#1c1816', shoe: '#17151a' }
  };

  // 天空/墙面（和视频一样的蓝色摄影棚）
  function background(shake) {
    const g = ctx;
    g.save();
    g.translate(shake.x, shake.y);
    const wall = g.createLinearGradient(0, 0, 0, GROUND);
    wall.addColorStop(0, '#a9d6f5');
    wall.addColorStop(0.6, '#6aaee3');
    wall.addColorStop(1, '#4a8fcc');
    g.fillStyle = wall;
    g.fillRect(-40, -40, W + 80, GROUND + 40);
    // 竖向墙缝

    g.lineWidth = 3;
    for (let x = 60; x < W; x += 170) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, GROUND); g.stroke();
    }
    // 顶部聚光
    const spot = g.createRadialGradient(W / 2, -80, 40, W / 2, -80, 900);
    spot.addColorStop(0, 'rgba(255,255,255,0.55)');
    spot.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = spot; g.fillRect(-40, -40, W + 80, GROUND + 40);
    // 地面
    const floor = g.createLinearGradient(0, GROUND, 0, H);
    floor.addColorStop(0, '#a8c6dc');
    floor.addColorStop(1, '#5f86a6');
    g.fillStyle = floor;
    g.fillRect(-40, GROUND, W + 80, H - GROUND + 40);
    // 地面反光条纹
    g.strokeStyle = 'rgba(255,255,255,0.35)';

    }
    // 舞台边缘亮线
    g.fillStyle = 'rgba(255,255,255,0.8)';

  }

  // 根据状态计算姿势（角度：0=向下，正值=朝面向方向摆）
  function pose(f) {
    const st = f.st, d = f.dur || 1, k = Math.min(1, st / d);
    const p = { lean: 0.05, bob: 0, legL: 0.06, legR: -0.06, kneeL: 0.05, kneeR: 0.05,
      armL: -0.35, armR: 0.9, elL: 0.6, elR: 1.2, tilt: 0, shiver: 0, off: 0, twist: 0, mouth: 'smile', sink: 0, rot: 0 };
    const breathe = Math.sin(f.clock * 3) * 2;
    p.bob = breathe;
    switch (f.state) {
      case 'idle': case 'ready':
        p.armR = 0.9 + Math.sin(f.clock * 4) * 0.08; p.armL = -0.4; break;
      case 'walk':
        p.legL = Math.sin(f.clock * 10) * 0.5; p.legR = -p.legL; break;
      case 'dodge': {               // 闪身步：腰胯先动 → 侧移 → 拧转 → 并步 → 刹住
        const e = k < 0.3 ? k / 0.3 : 1 - (k - 0.3) / 0.7;
        p.lean = 0.25 * e * f.dir * f.facing * -0.5 + 0.05;
        p.twist = Math.sin(k * Math.PI) * 0.5;
        p.legL = 0.6 * f.dir * (1 - k) - 0.2; p.legR = -0.4 * f.dir * (1 - k) + 0.1;
        p.kneeL = 0.5; p.kneeR = 0.3;
        p.armL = -1.2 * f.dir; p.armR = 1.3 * f.dir; p.elL = 0.2; p.elR = 0.4;
        p.mouth = 'o';
        break;
      }
      case 'kick': {                // 浪子踢球：准备 → 重心转移 → 后撩 → 前勾 → 反拧 → 收腿
        if (k < 0.2) { p.lean = -0.12 * k * 5; p.armL = 0.8; p.armR = -0.6; }
        else if (k < 0.45) { const e = (k - 0.2) / 0.25; p.lean = -0.1; p.legR = -0.9 * e; p.kneeR = 1.6 * e; p.armL = 0.9; p.armR = -1.4 * e + 0.2; p.elR = 0.4; }
        else if (k < 0.6) { const e = (k - 0.45) / 0.15; p.lean = -0.1 + 0.35 * e; p.legR = -0.9 + 1.9 * e; p.kneeR = 1.6 - 1.4 * e; p.armL = -1.2; p.armR = 1.6; p.twist = -0.6 * e; }
        else { const e = (k - 0.6) / 0.4; p.lean = 0.25 - 0.3 * e; p.legR = 1.0 - 1.0 * e; p.kneeR = 0.2 + 1.2 * e; p.armL = -1.2 + 1.2 * e; p.armR = 1.6 - 1.0 * e; p.twist = -0.6 + 0.6 * e; }
        p.legL = 0.08; p.kneeL = 0.2; p.mouth = 'shout';
        break;
      }
      case 'bear': {                // 狗熊哆嗦毛：屈膝 → 疯狂抖动 → 释放
        if (k < 0.3) { p.sink = 22 * (k / 0.3); p.kneeL = 0.6 * (k / 0.3); p.kneeR = 0.6 * (k / 0.3); p.legL = 0.25; p.legR = -0.25; p.armL = -0.9; p.armR = 0.9; }
        else if (k < 0.9) {
          p.sink = 22; p.kneeL = 0.6; p.kneeR = 0.6; p.legL = 0.25; p.legR = -0.25;
          p.shiver = Math.sin(f.clock * 70) * 0.35;
          p.armL = -0.9 + Math.sin(f.clock * 60) * 0.5; p.armR = 0.9 - Math.sin(f.clock * 60) * 0.5;
          p.tilt = Math.sin(f.clock * 55) * 0.3; p.off = Math.sin(f.clock * 60) * 3;
          p.mouth = 'shout';
        } else { p.sink = 10; p.armL = 1.4; p.armR = 1.4; p.elL = 0.1; p.elR = 0.1; p.mouth = 'shout'; }
        break;
      }
      case 'wobble': {              // 摇头晃脑：肩膀带动，头跟随
        const s = Math.sin(f.clock * 9);
        p.lean = 0.12 * s; p.tilt = 0.35 * Math.sin(f.clock * 9 - 0.6);
        p.armL = -0.5 + 0.5 * s; p.armR = 0.7 - 0.5 * s; p.mouth = 'q';
        p.legL = 0.15 * s; p.legR = -0.15 * s;
        break;
      }
      case 'mud': {                 // 拔泥步：踩下 → 停顿 → 拔起 → 再踩
        const cyc = (f.st * 2.2) % 1;
        const lift = cyc < 0.5 ? cyc / 0.5 : 1 - (cyc - 0.5) / 0.5;
        const leftUp = Math.floor((f.st * 2.2)) % 2 === 0;
        if (leftUp) { p.legL = 0.1 - 0.5 * lift; p.kneeL = 0.9 * lift; p.legR = -0.05; }
        else { p.legR = 0.1 - 0.5 * lift; p.kneeR = 0.9 * lift; p.legL = -0.05; }
        p.lean = 0.15; p.armL = -0.9; p.armR = 0.8; p.mouth = 'shout';
        break;
      }
      case 'shuffle': {             // 簸箕步：快速小碎步
        const s = Math.sin(f.clock * 36);
        p.legL = 0.35 * s; p.legR = -0.35 * s; p.kneeL = 0.5 + 0.3 * Math.max(0, s); p.kneeR = 0.5 + 0.3 * Math.max(0, -s);
        p.lean = 0.2; p.armL = 0.5 * s - 0.5; p.armR = -0.5 * s + 0.6; p.bob = Math.abs(s) * 4;
        p.mouth = 'shout';
        break;
      }
      case 'hit': {
        const e = Math.min(1, st * 6);
        p.lean = -0.35 * e; p.armL = -1.4; p.armR = 1.6; p.mouth = 'o'; p.tilt = -0.3 * e;

      }
      case 'down': {
        const e = Math.min(1, st * 2.5);

      }
      case 'win': p.armL = 2.6 + Math.sin(f.clock * 12) * 0.3; p.armR = -2.6 + Math.sin(f.clock * 12) * 0.3; p.mouth = 'shout'; p.legL = 0.2; p.legR = -0.2; break;
      case 'lose': p.tilt = 0.3; p.armL = 0.2; p.armR = 0.4; p.mouth = 'q'; break;
    }
    if (f.shiver > 0) {            // 被狗熊哆嗦毛震到：左右摇摆
      const a = Math.min(1, f.shiver / 0.6);
      p.tilt += Math.sin(f.clock * 45) * 0.28 * a;
      p.off = Math.sin(f.clock * 45) * 6 * a;
    }
    return p;
  }

  // 人物：骨架式 FK，线条角色 + 描边，夸张但保持人体比例
  function fighter(f, alpha = 1) {
    const g = ctx, c = PAL[f.team], p = pose(f);
    const fx = f.facing;
    g.save();
    g.globalAlpha = alpha;
    g.translate(f.x + p.off, GROUND + (f.jump || 0));
    if (p.rot) { g.translate(0, -30); g.rotate(p.rot * fx); g.translate(0, 30); }
    g.scale(fx, 1);
    const hip = { x: 0, y: -(FH.thigh + FH.shin) + p.sink + p.bob * 0.5 - p.shiver * 0 };
    const seg = (a, b, color, w) => {
      g.strokeStyle = '#1b1a22'; g.lineWidth = w + 5; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      g.strokeStyle = color; g.lineWidth = w;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    };
    const fk = (p0, len, ang) => ({ x: p0.x + Math.sin(ang) * len, y: p0.y + Math.cos(ang) * len });
    const leg = (side, ang, knee) => {
      const kn = fk(hip, FH.thigh, ang);
      const ft = fk(kn, FH.shin, ang + knee);
      return { kn, ft };
    };
    const L = leg('L', p.legL, p.kneeL), R = leg('R', p.legR, p.kneeR);
    // 后侧腿、手臂
    const drawLeg = (lg, back) => {
      seg(hip, lg.kn, c.pants, 17);
      seg(lg.kn, lg.ft, c.pants, 15);
      g.fillStyle = c.shoe; g.beginPath(); g.ellipse(lg.ft.x + 8, lg.ft.y + 2, 13, 6, 0, 0, Math.PI * 2); g.fill();
    };
    const backLeg = fx > 0 ? R : L, frontLeg = fx > 0 ? L : R;
    const bLeg = fx > 0 ? { ...p, legA: p.legR, kA: p.kneeR } : null;
    drawLeg(backLeg, true);
    // 躯干
    const lean = p.lean + p.shiver * 0.3;
    const sh = { x: hip.x + Math.sin(lean) * FH.torso, y: hip.y - Math.cos(lean) * FH.torso };
    const headC = { x: sh.x + Math.sin(lean + p.tilt) * FH.head * 1.05, y: sh.y - Math.cos(lean + p.tilt) * FH.head * 1.05 - 4 };
    const shoulderY = sh;
    // 手臂（后侧）
    const armBack = { s: { x: sh.x - 2, y: sh.y + 4 } };
    const armFront = { s: { x: sh.x + 2, y: sh.y + 4 } };
    const aBackAng = fx > 0 ? p.armL : p.armR, aFrontAng = fx > 0 ? p.armR : p.armL;
    const eBack = fx > 0 ? p.elL : p.elR, eFront = fx > 0 ? p.elR : p.elL;
    const elb = (s, a) => fk(s, FH.upper, a);
    const hnd = (e, a, bend) => fk(e, FH.fore, a + bend);
    const eb = elb(armBack.s, aBackAng), hb = hnd(eb, aBackAng, eBack);
    seg(armBack.s, eb, c.tee, 13); seg(eb, hb, c.skin, 11);
    // 躯干（短袖上衣）
    seg(hip, sh, c.tee, 34);
    g.strokeStyle = c.trim; g.lineWidth = 4;
    g.beginPath(); g.moveTo(sh.x - 6, sh.y + 2); g.lineTo(sh.x + Math.sin(lean) * 8 + 2, sh.y + 12); g.lineTo(sh.x + 6, sh.y + 2); g.stroke();
    if (f.team === 'a') { // 灰色花纹

      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(hip.x - 10, hip.y - 14 - i * 12); g.lineTo(hip.x + 10, hip.y - 14 - i * 12); g.stroke(); }
    }

    drawLeg(frontLeg, false);
    // 前侧手臂
    const ef = elb(armFront.s, aFrontAng), hf = hnd(ef, aFrontAng, eFront);
    seg(armFront.s, ef, c.tee, 13); seg(ef, hf, c.skin, 11);

    g.fillStyle = '#1b1a22';
    g.beginPath(); g.arc(headC.x, headC.y, FH.head + 2.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = c.skin;
    g.beginPath(); g.arc(headC.x, headC.y, FH.head, 0, Math.PI * 2); g.fill();
    // 发型：男性偏秃，只留两侧
    g.fillStyle = c.hair;
    g.beginPath(); g.arc(headC.x - 4, headC.y - 2, FH.head - 1, Math.PI * 0.55, Math.PI * 1.25); g.fill();
    // 眼睛与嘴
    g.fillStyle = '#1b1a22';
    g.beginPath(); g.arc(headC.x + 9, headC.y - 3, 2.2, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#1b1a22'; g.lineWidth = 2;
    g.beginPath();
    if (p.mouth === 'o') { g.fillStyle = '#5a1f1f'; g.arc(headC.x + 12, headC.y + 9, 3.5, 0, Math.PI * 2); g.fill(); }
    else if (p.mouth === 'shout') { g.fillStyle = '#5a1f1f'; g.ellipse(headC.x + 12, headC.y + 9, 4, 6, 0, 0, Math.PI * 2); g.fill(); }
    else if (p.mouth === 'q') { g.moveTo(headC.x + 8, headC.y + 11); g.lineTo(headC.x + 15, headC.y + 11); g.stroke(); }
    else { g.arc(headC.x + 11, headC.y + 8, 5, 0.2, Math.PI - 0.6); g.stroke(); }
    g.restore();
  }

  function ball(b) {
    const g = ctx;
    g.save();
    // 拖尾
    for (let i = 1; i <= 4; i++) {
      g.globalAlpha = 0.12 * (5 - i);
      g.fillStyle = '#ffd34d';
      g.beginPath(); g.arc(b.x - b.vx * i * 0.015, b.y - i * 1.5, 16 - i * 2, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    g.translate(b.x, b.y);
    g.rotate(b.rot);
    g.fillStyle = '#fbfbf7'; g.strokeStyle = '#1b1a22'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, 17, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#e8453c';
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      g.beginPath(); g.arc(Math.cos(a) * 9, Math.sin(a) * 9, 4, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  // 范围震荡波（狗熊哆嗦毛）
  function wave(w) {

  // 踩踏尘土（拔泥步、落脚）

  // 技能名字幕条（参考视频底部橙色标签）
  function ribbon(text, alpha) {

    g.save(); g.globalAlpha = alpha;
    const grd = g.createLinearGradient(0, 0, 360, 0);

  function popup(p) {
    const g = ctx, a = Math.min(1, p.life / 0.4);
    g.save(); g.globalAlpha = a;
    g.font = `900 ${p.size || 44}px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
    g.textAlign = 'center'; g.lineJoin = 'round';
    g.strokeStyle = '#1b1a22'; g.lineWidth = 8;
    g.strokeText(p.text, p.x, p.y); g.fillStyle = p.color || '#fff';
    g.fillText(p.text, p.x, p.y);
    g.restore();
  }

  function bubble(text, x, y) {
    const g = ctx;
    g.save();
    g.font = 'bold 22px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    const w = g.measureText(text).width + 26;
    g.fillStyle = '#fffdf2'; g.strokeStyle = '#1b1a22'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(x - w / 2, y - 30, w, 40, 12); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(x - 6, y + 10); g.lineTo(x + 2, y + 18); g.lineTo(x + 8, y + 10); g.fill(); g.stroke();
    g.fillStyle = '#1b1a22'; g.textAlign = 'center';
    g.fillText(text, x, y - 2);
    g.restore();

      case 'kick': startKick(P); break;
      case 'bear': startBear(P); break;
      case 'wobble': startWobble(P); break;
      case 'mud': startMud(P); break;
      case 'shuffle': startShuffle(P); break;
      case 'special': startSpecial(); break;
    }
  }
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()];
    if (!k) return;
    e.preventDefault();
    act(k);
  });

  const controls = document.getElementById('controls');
  controls.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-key]');
    if (!b) return;
    e.preventDefault();
    b.classList.add('down');
    act(b.dataset.key);
  });
  const release = () => document.querySelectorAll('.btn.down').forEach(b => b.classList.remove('down'));
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  // ---- 界面 ----
  const syncDiff = () => document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('on', +b.dataset.diff === diffIdx));
  document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => {
    diffIdx = +b.dataset.diff;
    try { localStorage.setItem('sbDiff', String(diffIdx)); } catch (e) {}
    syncDiff();
  }));
  syncDiff();
  $('startBtn').addEventListener('click', () => {
    Snd.init();
    $('menu').hidden = true;
    reset();
    Snd.startMusic();
    Snd.sfx('ready');
  });
  $('againBtn').addEventListener('click', () => {
    Snd.init();
    $('end').hidden = true;
    reset();
    Snd.startMusic();
    say(P, '再来！');
  });
  $('gear').addEventListener('click', () => { paused = true; $('settings').hidden = false; });
  $('closeSettings').addEventListener('click', () => { paused = false; $('settings').hidden = true; });
  document.querySelectorAll('[data-opt]').forEach(btn => {
    const k = btn.dataset.opt;
    const sync = () => { btn.textContent = Snd.opt[k] ? 'ON' : 'OFF'; };
    sync();
    btn.addEventListener('click', () => { Snd.init(); Snd.toggle(k); sync(); });
  });

  // ---- 主循环 ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused && P && phase !== 'menu') update(dt);
    if (P) {
      document.querySelectorAll('[data-key]').forEach(b => {
        const k = b.dataset.key;
        const cool = k === 'kick' ? P.cool.kick > 0 : k === 'bear' ? P.cool.bear > 0 : k === 'wobble' ? P.cool.wobble > 0
          : k === 'mud' ? P.cool.mud > 0 : k === 'shuffle' ? P.cool.shuffle > 0 : false;
        b.classList.toggle('cool', cool);
      });
    }
    if (P) render(now);
    requestAnimationFrame(frame);
  }
  // 初始化舞台（菜单背景也用同一个舞台）
  reset(); phase = 'menu';
  requestAnimationFrame(frame);
  if (!P) reset();
})();
</script>

</body></html>
