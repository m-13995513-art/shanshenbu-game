    if (G.mode === 'local2p') { title = (won ? 'PLAYER 1' : 'PLAYER 2') + ' WIN!'; sub = '再来一局分高下！'; }
    if (G.mode === 'online') { title = won ? 'TEAM WIN!' : 'TEAM LOST!'; }
    G.result = { won, title, sub, M: G.M, xp: Prog.match.xp, badges: Prog.match.badges.slice(), mode: G.mode, diff: G.diff };
    return G.result;
  }

  // ---------- 更新 ----------
  function update(dt) {
    if (G.paused) return;
    if (G.phase === 'menu') { updateDemo(dt); decay(dt); return; }
    if (G.netWait) return;
    dt *= G.ts;
    G.time += dt; G.funnyCd -= dt;
    decay(dt);

    if (G.phase === 'intro') {
      introT += dt;
      for (const f of G.F) {
        f.clock += dt; f.st += dt;
        const dx = f.home - f.x;
        if (Math.abs(dx) > 4 && introT < 2) { f.x += Math.sign(dx) * Math.min(Math.abs(dx), 430 * dt); f.state = 'idle'; f.facing = Math.sign(dx) || f.facing; }
        else { f.state = 'idle'; f.facing = f.team === 0 ? 1 : -1; }
      }
      const seq = [[1.3, '准备……', 'ready'], [2.2, '3', 'tick'], [3.0, '2', 'tick'], [3.8, '1', 'tick'], [4.6, '闪！', 'go']];
      if (introIdx < seq.length && introT >= seq[introIdx][0]) {
        const [, text, snd] = seq[introIdx];
        Eng.popup(text, 640, 380, text === '闪！' ? '#ffe14a' : '#fff', text === '闪！' ? 130 : 96, 0.8);
        Snd.sfx(snd); introIdx++;
        if (introIdx === seq.length) {
          G.phase = 'fight'; G.F.forEach(f => { f.state = 'idle'; });
          if (API.onPhase) API.onPhase('fight');
          if (Math.random() < 0.4 && !tut) Eng.funny('安徽民间舞蹈格斗启动！', 640, 250);
          if (G.mode === 'double') Eng.popup('DOUBLE BALL!', 640, 230, '#ffe14a', 64, 1.4);
          if (G.mode === 'village') Eng.popup('全村大乱斗！', 640, 230, '#ffe14a', 64, 1.4);
        }
      }
      return;
    }

    if (G.phase === 'ko') {
      koT += dt;
      for (const f of G.F) Eng.updateFighter(f, dt);
      Eng.updateBalls(dt);
      if (koT > 2.4 && !G.result) { buildResult(); G.phase = 'over'; if (API.onPhase) API.onPhase('over'); if (API.onEnd) API.onEnd(G.result); }
      return;
    }
    if (G.phase !== 'fight') { for (const f of G.F) f.clock += dt; return; }

    // 计时类效果
    if (G.chaos > 0) G.chaos -= dt;
    if (G.speedT > 0) { G.speedT -= dt; G.ts = 1.3; if (G.speedT <= 0) G.ts = 1; }
    if (G.wobbleT > 0) G.wobbleT -= dt;
    if (!G.online && !tut && !G.eventLock) {
      G.eventT -= dt;
      if (G.eventT <= 0) { G.eventT = (G.mode === 'double' ? 8 : 15) + Math.random() * 8; Eng.randomEvent(G.mode === 'double' && Math.random() < 0.6 ? 'double' : null); }
    }
    for (const f of G.F) {
      Eng.updateFighter(f, dt);
      if (f.ctl === 'ai') AI.update(f, dt);
    }
    // 延迟事件
    for (const l of G.later) l.t -= dt;
    const due = G.later.filter(l => l.t <= 0); G.later = G.later.filter(l => l.t > 0);
    due.forEach(l => l.fn());
    Eng.updateBalls(dt);
    separate();
    if (tut) updateTutorial(dt);
    // 联机：广播自己的快照（20Hz）
    if (G.online && typeof MP !== 'undefined') { netAccum += dt; if (netAccum >= 0.05) { netAccum = 0; MP.sendSnap(Eng.snapOf(G.me)); } }
    checkEnd();
  }

  function separate() {
    const L = G.F.filter(f => f.hp > 0 && f.state !== 'down');
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const a = L[i], b = L[j], gap = a.team === b.team ? 60 : (G.mode === 'village' ? 80 : 110);
      const d = b.x - a.x;
      if (Math.abs(d) < gap) {
        const push = (gap - Math.abs(d)) / 2 * (d >= 0 ? 1 : -1);
        if (a.local) a.x = clamp(a.x - push, 70, W - 70);
        if (b.local) b.x = clamp(b.x + push, 70, W - 70);
      }
    }
  }

  function decay(dt) {
    G.shake.mag *= Math.pow(0.001, dt);
    for (const p of G.popups) { p.life -= dt; p.age += dt; }
    G.popups = G.popups.filter(p => p.life > 0);
    for (const b of G.bubbles) b.t -= dt;
    G.bubbles = G.bubbles.filter(b => b.t > 0);
    for (const w of G.waves) w.t += dt;
    G.waves = G.waves.filter(w => w.t < w.life);
    if (G.ribbon.t > 0) G.ribbon.t -= dt;
    FX.update(dt);
    if (G.flash > 0) G.flash -= dt * 3;
  }

  // ---------- 教学：闪身步 → 浪子踢球 ----------
  const TUT = [
    '① 点击「← 闪身」或「闪身 →」按钮（电脑：A / D）',
    '② 躲开飞来的球！闪身有失败概率，失败会踉跄，球照样打中你',
    '③ 闪身成功并真的躲开攻击 = PERFECT DODGE！',
    '④ 浪子踢球：按「⚽ 浪子踢球」（J）把球踢向对手！',
    '教学完成！你已经学会闪身步和浪子踢球了'
  ];
  G.bus.skill = (f, key) => { if (typeof UI !== 'undefined') UI.iconPop(f, key); };
  G.bus.dodgeStart = () => { if (tut && tut.step === 0) advance(); };
    G.bus.perfect = () => { if (tut && (tut.step === 1 || tut.step === 2)) { if (tut.step === 1) advance(); advance(); } };
  G.bus.dodgeFail = () => { if (tut && tut.step === 1) { Eng.popup('再试一次！', 640, 300, '#fff', 40, 1); } };
  G.bus.kickHit = () => { if (tut && tut.step === 3) advance(); };
  function advance() { if (!tut) return; tut.step++; tut.t = 0; UI.tutorial(tut.step); Snd.sfx('combo'); }
  function updateTutorial(dt) {
    tut.t += dt;
    const dummy = G.F.find(f => f.dummy);
    if (tut.step === 1 || tut.step === 2) {
      tut.ballT -= dt;
      if (tut.ballT <= 0 && dummy && Eng.canAct(dummy)) { tut.ballT = 3; dummy.cool.kick = 0; Eng.kick(dummy); }
    }
    if (tut.step >= 4 && tut.t > 2.2 && G.phase === 'fight') {
      Store.data.tutorialDone = true; Store.save(); Prog.addPlayerXp(50);
      G.phase = 'over'; Snd.stopMusic(); Snd.sfx('win'); UI.tutorial(-1);
      G.result = { tutorial: true, won: true, title: '教学完成！', sub: '获得 50 XP', M: G.M, xp: 50, badges: [], mode: 'tutorial' };
      if (API.onPhase) API.onPhase('over'); if (API.onEnd) API.onEnd(G.result);
    }
  }
  API.skipTutorial = () => { Store.data.tutorialDone = true; Store.save(); UI.tutorial(-1); API.quit(); };
  API.tutText = i => TUT[i];

  // ---------- 等级提升 / 成就 ----------
  Prog.on('level', (key, lv) => {
    if (typeof UI !== 'undefined') UI.levelUp('skill', key, lv);
    Snd.sfx('levelup');
    const s = SKILLS[key], x = G.me ? G.me.x : 640;
    switch (s.fx) {
      case 'lines': FX.speedLines(x, GROUND - 110, 1, 10); FX.speedLines(x, GROUND - 110, -1, 10); break;
      case 'stars': FX.burst(x, GROUND - 130, 16, s.color, 'star', 420); break;
      case 'rings': FX.ring(x, GROUND, 360, s.color, 0.8); FX.ring(x, GROUND, 240, '#fff', 0.6); break;
      case 'swirl': FX.burst(x, GROUND - 200, 14, s.color, 'spark', 300); FX.ring(x, GROUND - 160, 200, s.color, 0.7, 0.6); break;
    }
    FX.flash(x, GROUND - 130, 220, '#fff'); G.flash = 0.5;
  });
  Prog.on('plevel', lv => { if (typeof UI !== 'undefined') UI.levelUp('player', null, lv); Snd.sfx('levelup'); FX.confetti(24); });
  Prog.on('badge', b => { if (typeof UI !== 'undefined') UI.toast('🏆 新成就解锁！', b.name); Snd.sfx('badge'); });

  // ---------- 菜单演示场景（角色循环搞笑动作） ----------
  const DEMO = [['dodge', 0.45], ['kick', 0.9], ['bear', 1.3], ['wobble', 1.8], ['stumble', 0.6], ['dance', 2.4]];
  function initDemo() {
    demo = [Eng.mkF({ id: 0, team: 0, ctl: 'demo', pal: Draw.PAL.p, x: 330 }), Eng.mkF({ id: 1, team: 1, ctl: 'demo', pal: Draw.PAL.a, x: 950, facing: -1 })];
    demo.forEach(f => { f.dir = 1; }); demoT = 0; demoIdx = 0; setDemo(0);
  }
  function setDemo(i) {
    demoIdx = i % DEMO.length; demoT = 0;
    const [s, d] = DEMO[demoIdx];
    demo.forEach((f, n) => { f.state = n === 0 ? s : DEMO[(demoIdx + 3) % DEMO.length][0]; f.dur = n === 0 ? d : DEMO[(demoIdx + 3) % DEMO.length][1]; f.st = 0; f.dir = n ? -1 : 1; f.from = f.x; });
  }
  function updateDemo(dt) {
    if (!demo) initDemo();
    demoT += dt;
    demo.forEach(f => {
      f.clock += dt; f.st += dt;
      if (f.state === 'dodge') f.off = 0;
      if (f.st > f.dur + 0.15) { f.state = 'idle'; }
    });
    if (demoT > DEMO[demoIdx][1] + 0.6) setDemo(demoIdx + 1);
  }

  // ---------- 摄像机 / 响应式画布 ----------
  // 画布 = 舞台 CSS 尺寸 × dpr。横屏：等比缩放，宽度铺满、上下只裁掉天花板（场景向四周延伸，绝不拉伸）；竖屏：专用镜头，只拍中间 880 世界宽并跟随人物。
  const cam = { dpr: 1, cw: 800, ch: 450, s: 0.6, x0: 0, y0: 0, hs: 0.6, hw: 1280, hh: 720, portrait: false, fx: 640, up: 0, down: 0, side: 0 };
  const stage = document.getElementById('stage');
  function resize() {
    const cw = Math.max(160, stage.clientWidth), ch = Math.max(90, stage.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cam.portrait = ch > cw * 0.9 || document.body.classList.contains('orient-portrait');
    cam.cw = cw; cam.ch = ch; cam.dpr = dpr;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    cam.s = cam.portrait ? cw / 880 : Math.min(cw / W, ch / 430);
    cam.hs = cam.portrait ? cw / 560 : cw / W;
    cam.hw = cw / cam.hs; cam.hh = ch / cam.hs;
    layoutCam();
  }
  function layoutCam() {
    const { cw, ch, s } = cam, vh = ch / s;
    const ytop = GROUND - 0.78 * vh;
    cam.x0 = cam.portrait ? cw / 2 - cam.fx * s : (cw - W * s) / 2;
    cam.y0 = -ytop * s;
    const left = -cam.x0 / s, right = (cw - cam.x0) / s;
    cam.side = Math.max(0, -left, right - W) + 30;
    cam.up = Math.max(0, -ytop) + 30; cam.down = Math.max(0, ytop + vh - H) + 30;
  }
  API.resize = resize;
  API.cam = cam;
  API.toScreen = (x, y) => ({ x: cam.x0 + x * cam.s, y: cam.y0 + y * cam.s });    // 世界坐标 → 舞台像素
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  // ---------- HUD（屏幕空间，按 hs 缩放；横屏虚拟宽 1280，竖屏虚拟宽 560） ----------
  function bar(x, y, w, h, hp, max, color, align) {
    ctx.save();
    ctx.fillStyle = 'rgba(15,24,34,0.72)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    const pw = w * clamp(hp / max, 0, 1);
    ctx.fillRect(align === 'r' ? x + w - pw : x, y, pw, h);
    ctx.strokeStyle = '#1b1a22'; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }
  function label(text, x, y, align, size = 22) {
    ctx.save();
    ctx.font = `900 ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = align === 'r' ? 'right' : align === 'c' ? 'center' : 'left';
    ctx.lineWidth = 4; ctx.strokeStyle = '#1b1a22'; ctx.fillStyle = '#fff';
    ctx.strokeText(text, x, y); ctx.fillText(text, x, y); ctx.restore();
  }
  function drawHud() {
    const me = G.me, F = G.F, hw = cam.hw, hh = cam.hh;
    const m = hw > 900 ? 40 : 14, gap = 66 / cam.hs, bw = (hw - 2 * m - gap) / 2, fs = Math.max(20, 15 / cam.hs * 1.0);
    const cap = (n) => Math.ceil(n);
    if (G.mode === 'village') {
      bar(m, 34, bw, 30, me.hp, me.maxhp, '#7fd36b', 'l'); label('PLAYER LV.' + Store.data.player.lv + '  ' + cap(me.hp), m, 28, 'l', fs);
      const foes = F.filter(f => f.team !== me.team);
      const left = foes.filter(f => f.hp > 0).length;
      const tot = foes.reduce((s, f) => s + f.maxhp, 0), cur = foes.reduce((s, f) => s + Math.max(0, f.hp), 0);
      bar(hw - m - bw, 34, bw, 30, cur, tot, '#ff7a59', 'r'); label('村民 ×' + left, hw - m, 28, 'r', fs);
    } else if (G.mode === 'online' && G.online.mode === '2v2') {
      F.forEach(f => {
        const l = f.team === 0, idx = F.filter(g => g.team === f.team).indexOf(f);
        const x = l ? m : hw - m - bw;
        bar(x, 34 + idx * 30, bw, 20, f.hp, f.maxhp, f === me ? '#7fd36b' : l ? '#6cc7ff' : '#ff7a59', l ? 'l' : 'r');
        label(f.name + ' ' + cap(f.hp), l ? x : x + bw, 30 + idx * 30, l ? 'l' : 'r', fs * 0.8);
      });
    } else {
      const foe = F.find(f => f !== me && f.team !== me.team) || F[1];
      const meLabel = G.mode === 'local2p' ? 'P1' : G.mode === 'online' ? me.name : 'PLAYER LV.' + Store.data.player.lv;
      const foeLabel = G.mode === 'local2p' ? 'P2' : G.mode === 'online' ? foe.name : 'AI · ' + DIFFS[G.diff].key;
      bar(m, 34, bw, 30, me.hp, me.maxhp, '#7fd36b', 'l'); label(meLabel + '  ' + cap(me.hp), m, 28, 'l', fs);
      bar(hw - m - bw, 34, bw, 30, foe.hp, foe.maxhp, '#ff7a59', 'r'); label(foeLabel + '  ' + cap(foe.hp), hw - m, 28, 'r', fs);
    }
    if (me.combo >= 2) {
      const pulse = 1 + Math.sin(performance.now() / 120) * 0.04;
      ctx.save(); ctx.translate(hw / 2, 62 / cam.hs + 34); ctx.scale(pulse, pulse);
      ctx.font = '900 30px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1b1a22'; ctx.lineWidth = 5; ctx.strokeText('COMBO ×' + me.combo, 0, 0); ctx.fillText('COMBO ×' + me.combo, 0, 0);
      ctx.restore();
    }
    if (G.chaos > 0) label('🌀 混乱模式 ' + Math.ceil(G.chaos), hw / 2, hh * 0.3, 'c', 22);
    if (G.speedT > 0) label('💨 极速 ' + Math.ceil(G.speedT), hw / 2, hh * 0.3 + 28, 'c', 22);
  }
  // 屏幕居中的全局提示（x==640 的字幕）在 HUD 空间绘制，避免被横屏摄像机裁掉
  function globalPopup(p) {
    const hy = cam.hh * 0.22 + (p.y - 150) * (cam.hh / 900);
    ctx.save(); ctx.translate(cam.hw / 2, hy);
    const k = Math.min(1, cam.hw / 1100);
    ctx.scale(k, k);
    Draw.popup({ ...p, x: 0, y: 0 });
    ctx.restore();
  }

  function render() {
    const dt = 1 / 60;
    const sway = G.wobbleT > 0 ? Math.sin(G.time * 6) * 4 * Math.min(1, G.wobbleT) : 0;
    G.shake.x = (Math.random() - 0.5) * G.shake.mag + sway; G.shake.y = (Math.random() - 0.5) * G.shake.mag;
    const list = G.phase === 'menu' ? demo || [] : G.F;
    let camx = 640;
    if (list.length) camx = list.reduce((s, f) => s + f.x, 0) / list.length;
    if (cam.portrait) {
      let tgt = camx;
      if (G.me && G.phase !== 'menu') { const e = Eng.nearest(G.me); tgt = e ? (G.me.x + e.x) / 2 : G.me.x; }
      cam.fx += (clamp(tgt, 440, 840) - cam.fx) * 0.12;
    } else cam.fx = 640;
    layoutCam();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(cam.dpr, 0, 0, cam.dpr, 0, 0);
    ctx.save();
    ctx.translate(cam.x0, cam.y0); ctx.scale(cam.s, cam.s);
    Draw.background(G.shake, camx, cam.up, cam.down, cam.side);
    ctx.save();
    ctx.translate(G.shake.x, G.shake.y);
    for (const f of list) for (const g of f.ghosts || []) Draw.fighter(g, 0.28 * (g.life / 0.28));
    const order = [...list].sort((a, b) => (a === G.me) - (b === G.me));
    order.forEach(f => Draw.fighter(f));
    if (G.phase !== 'menu') {
      if (G.mode === 'village' || (G.mode === 'online')) G.F.forEach(f => Draw.tag(f, G.mode === 'village'));
      for (const b of G.balls) Draw.ball(b);
      for (const w of G.waves) Draw.wave(w);
      for (const b of G.bubbles) Draw.bubble(b.text, b.f.x, GROUND - 300 * (b.f.scale || 1));
    }
    FX.draw(ctx);
    if (G.phase !== 'menu') for (const p of G.popups) if (p.x !== 640) Draw.popup(p);
    ctx.restore();
    ctx.restore();
    // HUD 层
    if (G.phase !== 'menu') {
      ctx.save(); ctx.setTransform(cam.dpr * cam.hs, 0, 0, cam.dpr * cam.hs, 0, 0);
      Draw.ribbon(G.ribbon.t > 0 ? G.ribbon.text : '', Math.min(1, G.ribbon.t * 3), cam.hh - 66);
      for (const p of G.popups) if (p.x === 640) globalPopup(p);
      if (G.me) drawHud();
      ctx.restore();
    }
    ctx.setTransform(cam.dpr, 0, 0, cam.dpr, 0, 0);
    if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, G.flash)})`; ctx.fillRect(0, 0, cam.cw, cam.ch); }
  }

  // ---------- 主循环（只启动一次） ----------
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    render();
    UI.frame(dt);
    requestAnimationFrame(frame);
  }
  API.boot = () => {
    if (running) return; running = true;
    resize(); initDemo(); last = performance.now();
    requestAnimationFrame(frame);
  };
  return API;
})();

// 联机客户端：WebSocket 连接服务器（server/server.js），房间、同步、断线重连。
const MP = (() => {
  let ws = null, url = '', closing = false, tries = 0, rt = null;
  const S = { connected: false, code: '', slot: -1, mode: '1v1', host: 0, players: [], token: '', state: 'lobby', inGame: false };
  const M = { S, on: {} };
  const fire = (n, a, b) => { if (M.on[n]) M.on[n](a, b); };

  M.SERVER_URL = 'wss://shanshenbu-realtime.m-13995513.workers.dev';   // 默认联机服务器地址（玩家可在联机页面里修改）
  M.supported = () => 'WebSocket' in window;
  M.defaultUrl = () => M.SERVER_URL;
  M._oldDefault = () => (location.protocol === 'http:' || location.protocol === 'https:') && location.host && !/claude\.ai|claudeusercontent/.test(location.host)
    ? (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host : 'ws://localhost:8787';
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  M.connect = u => new Promise((resolve, reject) => {
    if (!M.supported()) return reject(new Error('当前浏览器不支持实时联机，请使用最新版 Chrome。'));
    u = u || M.SERVER_URL; url = u; closing = false;
    try { if (ws) { closing = true; ws.close(); } ws = new WebSocket(u); } catch (e) { return reject(new Error('服务器地址无效，或当前页面不允许联机（请用 server/server.js 托管游戏）。')); }
    const to = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('连接超时：无法连接服务器。请确认已运行 server/server.js，并且地址正确。')); }, 6000);
    ws.onopen = () => { clearTimeout(to); closing = false; S.connected = true; tries = 0; resolve(); };
    ws.onerror = () => { clearTimeout(to); reject(new Error('无法连接服务器。请确认已运行 server/server.js，并且地址正确。')); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } handle(m); };
    ws.onclose = () => { S.connected = false; if (!closing && S.code && S.token) reconnect(); else if (!closing) fire('closed'); };
  });

  function reconnect() {                       // 断线重连：最多尝试 10 次
    fire('peer', 'selfDisconnected', S.slot);
    if (rt) return;
    rt = setInterval(() => {
      if (++tries > 10) { clearInterval(rt); rt = null; S.code = ''; fire('closed'); return; }
      M.connect(url).then(() => { clearInterval(rt); rt = null; send({ t: 'rejoin', code: S.code, token: S.token }); }).catch(() => {});
    }, 2000);
  }

  function handle(m) {
    switch (m.t) {
      case 'created': case 'joined':
        S.code = m.code; S.slot = m.slot; S.token = m.token; S.mode = m.mode; fire('joined', m); break;
      case 'room': Object.assign(S, { code: m.code, mode: m.mode, host: m.host, players: m.players, state: m.state }); fire('room', S); break;
      case 'err': fire('error', m.msg, m); break;
      case 'start': S.inGame = true; fire('start', { slot: S.slot, mode: m.mode, players: m.players }); break;
      case 'resume': S.inGame = true; fire('resume', { slot: S.slot, mode: S.mode, players: m.players }); break;
      case 'snap': Game.netSnap(m.slot, m.s); break;
      case 'ev': Game.netEv(m.slot, m.ev); break;
      case 'over': S.inGame = false; Game.netOver(m.winTeam); break;
      case 'peer': Game.netPeer(m.status); fire('peer', m.status, m.slot); break;
    }
  }

  M.create = (mode, name) => send({ t: 'create', mode, name });
  M.join = (code, name) => send({ t: 'join', code, name });
  M.ready = v => send({ t: 'ready', v });
  M.start = () => send({ t: 'start' });
  M.abort = () => send({ t: 'abort' });
  M.sendSnap = s => send({ t: 'snap', s });
  M.sendEv = ev => send({ t: 'ev', ev });
  M.sendKo = () => send({ t: 'ko' });
  M.leaveGame = () => { S.inGame = false; };
  M.leaveRoom = () => { send({ t: 'leave' }); S.code = ''; S.token = ''; S.players = []; closing = true; if (rt) { clearInterval(rt); rt = null; } try { if (ws) ws.close(); } catch (e) {} S.connected = false; };
  return M;
})();

    skills: () => `<div class="panel"><h2>💪 技能</h2>
      <div class="row"><span>PLAYER LV.${S().player.lv}</span><span>${S().player.xp} / ${Skills.playerNeed(S().player.lv)} XP</span></div>
      ${SKILL_KEYS.map(k => { const s = SKILLS[k], d = S().skills[k]; const need = Skills.skillNeed(d.lv);
        const tot = d.ok + d.fail;
        const stats = k === 'dodge'
          ? `<span>成功</span><b>${d.ok}</b><span>失败</span><b>${d.fail}</b><span>成功率</span><b>${Math.round(Skills.rate(d.lv) * 100)}%${tot ? '（实际 ' + Math.round(100 * d.ok / tot) + '%）' : ''}</b><span>使用次数</span><b>${d.uses}</b>`
          : `<span>使用次数</span><b>${d.uses}</b><span>冷却</span><b>${(s.cd * Skills.mul(d.lv, k).cd).toFixed(1)} 秒</b>`;
        return `<div class="skill"><div class="pic">${imgTag(s.img, s.icon)}</div><div><b style="font-size:17px">${s.icon} ${s.name}　Lv.${d.lv}${d.lv >= 10 ? '（满级）' : ''}</b>
        <div class="bar"><i style="width:${d.lv >= 10 ? 100 : 100 * d.xp / need}%"></i></div>熟练度 ${d.lv >= 10 ? 'MAX' : d.xp + ' / ' + need}
        <div class="st">${stats}</div>${s.desc}<br><small>${s.grow}</small></div></div>`; }).join('')}
      <button class="btn sm" data-go="menu">返回</button></div>`,

    help: () => `<div class="panel"><h2>📖 游戏说明</h2><div class="note" style="font-size:15px">
      <b>目标：</b>用搞笑舞步把对手 HP 打到 0，同时用「闪身步」躲开攻击。<br>
      <b>闪身步（← 闪身 / 闪身 →）：</b>左右按钮共用一个等级。每次按下都有失败概率：Lv.1 成功率 70%，每级提高，Lv.10 为 90%，永远不会 100%。成功＝瞬间侧闪；失败＝踉跄、打滑，攻击照样命中。成功并真的躲开攻击＝PERFECT DODGE!，获得 Combo、XP 和闪身步熟练度。连续成功会出现 DODGE x2 / x3 …<br>
      <b>浪子踢球：</b>把球踢向对手，球会反弹。<b>狗熊哆嗦毛：</b>范围冲击波（SHAKE!）。<b>摇头晃脑：</b>让对手 CONFUSED!。<br>
      <b>冷却：</b>左闪 1 秒、右闪 1 秒（各自独立）、踢球 2 秒、哆嗦毛 4 秒、摇头 5 秒，冷却中按钮变暗并显示剩余秒数。<br>
      <b>键盘：</b>A ← 闪身 · D 闪身 → · J 浪子踢球 · K 狗熊哆嗦毛 · L 摇头晃脑 · ESC 暂停　<b>鼠标：</b>点击按钮，悬停可预览技能图片。<br>
      <b>触屏：</b>点击屏幕下方 5 个技能按钮。手机建议横屏。<br>
      <b>音频：</b>闪身步、浪子踢球、狗熊哆嗦毛、摇头晃脑触发时，播放从你提供的参考视频中提取的原声。</div><button class="btn sm" data-go="menu">返回</button></div>`,

    settings: () => { const s = S().settings; const sl = (k, n) => `<div class="row"><span>${n}</span><input type="range" min="0" max="100" value="${Math.round(s[k] * 100)}" data-vol="${k}"></div>`;
      const tg = (k, n) => `<div class="row"><span>${n}</span><button class="btn sm ${s[k] ? 'on' : ''}" data-tog="${k}">${s[k] ? 'ON' : 'OFF'}</button></div>`;
      return `<div class="panel"><h2>⚙ 设置</h2>${sl('master', '🔊 总音量')}${sl('music', '🎵 音乐音量')}${tg('musicOn', '🎵 音乐')}${sl('sfx', '💥 音效音量')}${tg('sfxOn', '💥 音效')}${sl('voice', '🗣️ 角色声音音量')}${tg('voiceOn', '🗣️ 角色声音')}
      <div class="chips"><button class="btn sm ${s.muted ? 'on' : ''}" data-go="mute">${s.muted ? '恢复声音' : '静音'}</button><button class="btn sm" data-go="resetsave" id="rs">重置存档</button></div>
      <button class="btn" data-go="${U.settingsBack || 'menu'}">返回</button></div>`; },

    pause: () => `<div class="panel" style="width:min(380px,92%)"><h2>⏸ 暂停</h2><button class="btn hero" data-go="resume">继续游戏</button><button class="btn" data-go="restart">重新开始</button><button class="btn" data-go="settingsP">设置</button><button class="btn" data-go="quit">返回大厅</button></div>`,

    result: () => { const r = lastRes, M = r.M; const names = r.badges.map(id => Prog.BADGES.find(b => b.id === id)).filter(Boolean);
      return `<div class="big" style="font-size:clamp(34px,8vw,80px);color:${r.won ? '#ffe14a' : '#ff8a6b'}">${r.title}</div><div class="big">${r.sub}</div>
      ${r.tutorial ? '' : `<div class="panel" style="width:min(460px,94%)"><h2>本局统计</h2><div class="stat"><span>总伤害</span><span>${M.damage}</span><span>闪身步次数 / 失败</span><span>${M.dodgeUse} / ${M.dodgeFail}</span><span>躲开攻击（成功闪身）</span><span>${M.dodgeOk}</span><span>Perfect Dodge</span><span>${M.perfect}</span><span>踢球次数 / 命中</span><span>${M.kicks} / ${M.kickHit}</span><span>最高 Combo</span><span>${M.maxCombo}</span><span>获得 XP</span><span>${r.xp}</span></div>
      ${names.length ? '<h3>🏆 新成就解锁！</h3>' + names.map(b => `<b>${b.icon} ${b.name}</b>`).join('　') : ''}</div>`}
      <div class="chips">${r.tutorial ? '<button class="btn hero" data-go="start">开始对战</button>' : r.mode === 'online' ? '<button class="btn hero" data-go="backlobby">回到房间</button>' : '<button class="btn hero" data-go="restart">再来一局</button>'}<button class="btn" data-go="quit">返回大厅</button></div>`; }
  };

  // ---------- 事件（事件委托） ----------
  const AFTER = {
    skills() { /* 预览在 frame 中绘制 */ },
    online() { online.err = online.err || ''; }
  };
  const readOnline = () => {
    const n = $('olName'), u = $('olUrl'); if (n) online.name = n.value.trim(); if (u) online.url = u.value.trim() || MP.SERVER_URL;
    S().server = online.url; Store.save();
  };
  const err = m => { online.err = m; online.busy = false; const e = $('olErr'); if (e) e.textContent = m; if (cur === 'online') { const bs = scr.querySelectorAll('[data-go=create],[data-go=joinroom]'); bs.forEach(b => { b.disabled = false; }); } };

  function startGame(mode) {
    hide(); $('controls').hidden = false; buildControls(mode);
    Game.start({ mode, diff: S().settings.diff });
  }
  function begin() { S().settings.mode = sel.mode; Store.save(); startGame(sel.mode); }

  function go(a) {
    switch (a) {
      case 'start': if (!S().tutorialDone) { sel.mode = 'tutorial'; startGame('tutorial'); } else startGame(S().settings.mode === 'tutorial' ? 'ai' : S().settings.mode); break;
      case 'mode': sel.mode = S().settings.mode; show('mode'); break;
      case 'begin': begin(); break;
      case 'menu': show('menu'); break;
      case 'online': online.name = online.name || '玩家' + Math.floor(Math.random() * 90 + 10); online.url = online.url || S().server || MP.SERVER_URL; online.err = ''; show('online'); break;
      case 'ach': show('ach'); break; case 'skills': show('skills'); break; case 'help': show('help'); break;
      case 'settings': U.settingsBack = 'menu'; show('settings'); break;
      case 'settingsP': U.settingsBack = 'pause'; show('settings'); break;
      case 'pause': show('pause'); break;
      case 'resume': hide(); $('pauseBtn').hidden = false; Game.resume(); break;
      case 'restart': hide(); buildControls(Game.cfg.mode); $('controls').hidden = false; Game.restart(); break;
      case 'quit': Game.quit(); break;
      case 'mute': S().settings.muted = !S().settings.muted; Snd.apply(S().settings); Store.save(); show('settings'); break;
      case 'resetsave': { const b = $('rs'); if (b.dataset.arm) { Store.reset(); Snd.apply(S().settings); show('settings'); } else { b.dataset.arm = 1; b.textContent = '再点一次确认重置'; } break; }
      case 'create': case 'joinroom': {
        readOnline();
        if (!online.url) return err('请先填写服务器地址。');
        const code = ($('olCode').value || '').trim().toUpperCase();
        if (a === 'joinroom' && !/^[0-9A-Z]{6}$/.test(code)) return err('请输入 6 位联机密码（0-9、A-Z）。');
        online.busy = true; err(''); online.busy = true;
        $('olErr').textContent = '正在连接服务器……';
        MP.connect(online.url).then(() => { if (a === 'create') MP.create(online.mode, online.name); else MP.join(code, online.name); })
          .catch(e => err(e.message));
        break;
      }
      case 'olready': { const p = MP.S.players[MP.S.slot]; MP.ready(!(p && p.ready)); break; }
      case 'olstart': MP.start(); break;
      case 'olleave': MP.leaveRoom(); online.err = ''; show('online'); break;
      case 'backlobby': Game.quit(); if (MP.S.code) show('lobby'); else show('menu'); break;
    }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-mode],[data-diff],[data-omode],[data-badge],[data-tog]');
    if (!t || !scr.contains(t) && t.id !== 'rotOk' && !t.closest('#netbar')) return;
    click();
    if (t.dataset.go) go(t.dataset.go);
    else if (t.dataset.mode) { sel.mode = t.dataset.mode; show('mode'); }
    else if (t.dataset.diff) { S().settings.diff = +t.dataset.diff; Store.save(); show('mode'); }
    else if (t.dataset.omode) { readOnline(); online.mode = t.dataset.omode; show('online'); }
    else if (t.dataset.badge) { const b = Prog.BADGES.find(x => x.id === t.dataset.badge), g = S().badges[b.id]; $('badgeInfo').textContent = `${b.name}：${b.desc}　进度 ${Prog.progress(b)} / ${b.goal}　${g ? '获得日期 ' + new Date(g.ts).toLocaleDateString() : '（未获得）'}`; }
    else if (t.dataset.tog) { const k = t.dataset.tog; S().settings[k] = !S().settings[k]; Snd.apply(S().settings); Store.save(); show('settings'); }
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.vol; if (!k) return;
    S().settings[k] = e.target.value / 100; Snd.apply(S().settings); Store.save();
  });
  $('pauseBtn').addEventListener('click', () => { click(); Game.pause(); });
  $('tutSkip').addEventListener('click', () => { click(); Game.skipTutorial(); });

  // ---------- 教学提示 / Toast / 联机提示条 ----------
  U.tutorial = i => { const t = $('tut'); if (i < 0) { t.hidden = true; return; } t.hidden = false; $('tutText').textContent = Game.tutText(i); };
  U.toast = (title, sub) => {
    const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = esc(title) + (sub ? '<br>' + esc(sub) : '');
    $('stage').appendChild(d); setTimeout(() => d.remove(), 3200);
  };
  const netbar = $('netbar');
  function netMsg(html) { netbar.hidden = !html; netbar.innerHTML = html || ''; }

  // ---------- 联机回调 ----------
  MP.on.joined = () => { online.busy = false; online.err = ''; show('lobby'); };
  MP.on.room = () => { if (cur === 'lobby') show('lobby'); };
  MP.on.error = m => { online.busy = false; if (cur === 'lobby' || cur === 'online') { online.err = m; const e = $('olErr'); if (e) e.textContent = m; if (cur === 'online') show('online'); } else U.toast(m); };
  MP.on.start = info => {
    online.err = ''; netMsg('');
    hide(); $('controls').hidden = false; buildControls('online');
    Game.start({ mode: 'online', online: info });
  };
  MP.on.resume = () => {};
  MP.on.peer = (status, slot) => {
    if (status === 'disconnected') netMsg('玩家已断线。等待重新连接……');
    else if (status === 'selfDisconnected') netMsg('与服务器断开，正在重新连接……');
    else if (status === 'back') netMsg('');
    else if (status === 'left') {
      const host = MP.S.host === MP.S.slot;
      netMsg('玩家离开了房间。' + (host ? '<button class="btn sm" data-go="olabort">重新开始</button>' : '') + '<button class="btn sm" data-go="olleave2">退出房间</button>');
    }
  };
  MP.on.closed = () => { netMsg(''); Game.quit(); online.err = '与服务器的连接已断开。'; show('online'); };
  netbar.addEventListener('click', e => {
    const a = e.target.dataset.go;
    if (a === 'olabort') { MP.abort(); netMsg(''); Game.quit(); show('lobby'); }
    if (a === 'olleave2') { MP.leaveRoom(); netMsg(''); Game.quit(); show('menu'); }
  });

  // ---------- 技能按钮：只有 5 个 ----------
  const BTNS = [
    { k: 'dodgeL', img: 'flashLeft', name: '← 闪身', ic: '⚡', cls: 'dg', key: ['A', '←'], skill: 'dodge' },
    { k: 'kick', img: 'kick', name: '浪子踢球', ic: '⚽', cls: 'k-kick', key: ['J', '1'], skill: 'kick' },
    { k: 'bear', img: 'shake', name: '狗熊哆嗦毛', ic: '🐻', cls: 'k-bear', key: ['K', '2'], skill: 'bear' },
    { k: 'wobble', img: 'head', name: '摇头晃脑', ic: '🧠', cls: 'k-wobble', key: ['L', '3'], skill: 'wobble' },
    { k: 'dodgeR', img: 'flash', name: '闪身 →', ic: '⚡', cls: 'dg', key: ['D', '→'], skill: 'dodge' }
  ];
  function padHtml(p, small) {
    return `<div class="pad ${small ? 'p2' : ''}" data-pad="${p}">` + BTNS.map(b =>
      `<button class="gb ${b.cls}" data-k="${b.k}" data-p="${p}" aria-label="${b.name}"><span class="kh">${b.key[p]}</span><span class="im">${imgTag(b.img, b.ic)}</span><span class="nm">${b.name}</span><span class="cd"></span></button>`).join('') + '</div>';
  }
  function buildControls(mode) { const c = $('controls'); c.classList.toggle('two', mode === 'local2p'); c.innerHTML = mode === 'local2p' ? padHtml(0, true) + padHtml(1, true) : padHtml(0, false); }
  const ctl = $('controls');
  const press = (b) => {
    Snd.init();
    b.classList.add('down');
    if (Game.press(+b.dataset.p, b.dataset.k)) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  };
  ctl.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    e.preventDefault(); press(b);
  });
  const up = e => { const b = e.target.closest && e.target.closest('[data-k]'); if (b) b.classList.remove('down'); ctl.querySelectorAll('.down').forEach(x => { if (e.type === 'pointercancel' || x === b) x.classList.remove('down'); }); };
  ctl.addEventListener('pointerup', up); ctl.addEventListener('pointercancel', up); ctl.addEventListener('pointerleave', up, true);
  ctl.addEventListener('contextmenu', e => e.preventDefault());
  ctl.addEventListener('dblclick', e => e.preventDefault());
  // 电脑：鼠标移上去显示技能图片预览
  const tip = $('tip');
  ctl.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    const b = e.target.closest('[data-k]'); if (!b) { tip.hidden = true; return; }
    const d = BTNS.find(x => x.k === b.dataset.k), r = b.getBoundingClientRect();
    tip.innerHTML = imgTag(d.img, d.ic) + `${d.name}<small>键位：${d.key[+b.dataset.p]}　冷却 ${SKILLS[d.skill].cd} 秒</small>`;
    tip.hidden = false; tip.style.left = Math.max(170, Math.min(innerWidth - 170, r.left + r.width / 2)) + 'px'; tip.style.top = (r.top - 10) + 'px';
  });
  ctl.addEventListener('pointerleave', () => { tip.hidden = true; });

  // ---------- 每帧：冷却显示（1.0 / 0.8 / 0.5） ----------
  U.frame = dt => {
    const me = G.me;
    if (!ctl.hidden && me) {
      ctl.querySelectorAll('[data-k]').forEach(b => {
        const f = +b.dataset.p === 0 ? G.me : G.p2; if (!f) return;
        const cd = Math.max(0, f.cool[b.dataset.k] || 0);
        const label = cd > 0.04 ? cd.toFixed(1) : '';
        const span = b.lastChild;
        if (span.textContent !== label) { span.textContent = label; b.classList.toggle('cdon', !!label); }
      });
    }
  };

  // ---------- 技能使用：小图标放大 → 缩小消失（不盖住整个画面）；技能升级：图片 + LEVEL UP! ----------
  U.iconPop = (f, key) => {
    if (!f || G.phase !== 'fight') return;
    const img = key === 'dodge' ? (f.dir < 0 ? 'flashLeft' : 'flash') : Assets.skill(key); if (!img) return;
    const p = Game.toScreen(f.x, 575 - 235 * (f.scale || 1));
    const d = document.createElement('div'); d.className = 'ipop';
    d.innerHTML = imgTag(img, SKILLS[key].icon);
    d.style.left = Math.max(40, Math.min(Game.cam.cw - 40, p.x)) + 'px'; d.style.top = Math.max(86, p.y) + 'px';
    $('stage').appendChild(d); setTimeout(() => d.remove(), 800);
  };
  const lvQ = []; let lvBusy = false;
  U.levelUp = (kind, key, lv) => { lvQ.push({ kind, key, lv }); if (!lvBusy) nextLv(); };
  function nextLv() {
    const q = lvQ.shift(), box = $('lvl'); if (!q) { lvBusy = false; box.hidden = true; return; }
    lvBusy = true;
    const s = q.kind === 'skill' ? SKILLS[q.key] : null;
    box.innerHTML = `<div class="card2" style="border-color:${s ? s.color : '#ffe14a'}">${s ? imgTag(s.img, s.icon) : ''}<div class="t1">${s ? 'LEVEL UP!' : 'PLAYER LEVEL UP!'}</div><div class="t2">${s ? s.name + ' Lv.' + q.lv : 'PLAYER LV.' + q.lv}</div></div>`;
    box.hidden = false;
    setTimeout(() => { box.hidden = true; setTimeout(nextLv, 120); }, 2100);
  }

  // ---------- 设备检测：手机 / 平板 / 电脑 + 横竖屏（不只看 UA） ----------
  let portraitOk = false;
  function detect() {
    const w = innerWidth, h = innerHeight, short = Math.min(w, h);
    const touch = (navigator.maxTouchPoints || 0) > 0, mm = q => window.matchMedia && matchMedia(q).matches;
    const coarse = mm('(pointer:coarse)') || (touch && !mm('(hover:hover) and (pointer:fine)'));
    const dev = !coarse ? 'desktop' : short < 540 ? 'phone' : 'tablet';
    const portrait = h > w;
    const c = document.body.classList;
    ['dev-phone', 'dev-tablet', 'dev-desktop', 'orient-portrait', 'orient-landscape'].forEach(x => c.remove(x));
    c.add('dev-' + dev, portrait ? 'orient-portrait' : 'orient-landscape');
    $('rotate').classList.toggle('show', dev === 'phone' && portrait && !portraitOk);
    U.device = { dev, portrait, w, h };
    requestAnimationFrame(() => Game.resize());
  }
  U.detect = detect;
  window.addEventListener('resize', detect);
  window.addEventListener('orientationchange', () => setTimeout(detect, 150));
  $('rotOk').addEventListener('click', () => { portraitOk = true; detect(); });

  // ---------- 游戏阶段回调 ----------
  Game.onPhase = ph => {
    if (ph === 'fight' || ph === 'intro') { $('pauseBtn').hidden = false; if (cur === 'pause') hide(); }
    if (ph === 'pause') show('pause');
    if (ph === 'menu') { $('controls').hidden = true; $('pauseBtn').hidden = true; $('tut').hidden = true; netMsg(''); show('menu'); }
    if (ph === 'ko') $('pauseBtn').hidden = true;
  };
  Game.onEnd = r => { lastRes = r; $('pauseBtn').hidden = true; setTimeout(() => show('result'), 100); };

  U.boot = () => {
    Store.load();
    Snd.apply(S().settings);
    online.url = S().server || MP.SERVER_URL; online.name = '玩家' + Math.floor(Math.random() * 90 + 10);
    detect(); Game.boot(); show('menu');
    // 首次点击后解锁音频（浏览器要求用户手势）
    document.addEventListener('pointerdown', () => Snd.init(), { once: true });
  };
  return U;
})();
document.getElementById('c') && UI.boot();

</script>

</body></html>
