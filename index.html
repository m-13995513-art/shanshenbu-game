<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>闪身步大乱斗</title>
<style>
:root{--ink:#1b1a22;--paper:#fffdf2;--orange:#f2602a;--yellow:#ffe14a;--sky:#6aaee3;--mint:#8fe08a}
html,body{height:100%;margin:0}
body{background:#14202e;color:#fff;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:relative;flex:1;min-height:0;background:#0f1822;border-radius:10px;overflow:hidden;margin-top:6px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(14,24,36,.55);text-align:center;padding:12px;box-sizing:border-box;overflow:auto}
.overlay[hidden],[hidden]{display:none!important}
h1{margin:0;font-size:clamp(30px,7vw,76px);font-weight:900;color:#ffe14a;-webkit-text-stroke:2px #1b1a22;text-shadow:0 6px 0 #f2602a,0 10px 0 #1b1a22;letter-spacing:.04em;line-height:1.1}
.tag{font-size:clamp(13px,2.4vw,20px);font-weight:900;color:#fff;text-shadow:0 2px 0 #1b1a22;letter-spacing:.08em}
.big{font-size:clamp(20px,4vw,34px);font-weight:900;color:#fff;text-shadow:0 3px 0 #1b1a22}
.btn{font:inherit;font-weight:900;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:none;padding:8px 16px;min-height:44px;font-size:clamp(14px,2.4vw,19px)}
.btn:active,.btn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.on{background:var(--orange);color:#fff;text-shadow:0 1px 0 var(--ink)}
.btn.hero{background:var(--orange);color:#fff;font-size:clamp(18px,3.4vw,28px);padding:12px 34px;text-shadow:0 2px 0 var(--ink)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(150px,230px));gap:10px 14px}
.menu .btn{text-align:left;padding:10px 16px}.menu .btn.hero{grid-column:1/-1;text-align:center}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;width:min(760px,96%);max-height:96%;overflow:auto;text-align:left;box-sizing:border-box}
.panel h2{margin:0;font-size:22px}.panel h3{margin:4px 0 0;font-size:15px;opacity:.7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900;font-size:17px;flex-wrap:wrap}
.row input[type=range]{flex:1;min-width:120px;max-width:260px}
.inp{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;min-height:20px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.code{font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:.2em;color:var(--orange);text-align:center;font-family:ui-monospace,Menlo,monospace}
.err{color:#c62d1f;font-weight:900;min-height:1.2em}.note{font-size:13px;opacity:.75;font-weight:700;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:3px solid var(--ink);border-radius:14px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:4px;cursor:pointer;font-weight:900;font-size:14px}
.card.locked{filter:grayscale(1);opacity:.55}.card .ic{font-size:30px}.card small{font-weight:700;opacity:.7}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#e6e1cf;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}
.skill{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:8px;background:#fff;font-weight:700;font-size:14px;line-height:1.5}
.skill .pic{background:linear-gradient(#a9d6f5,#6aaee3);border-radius:10px;padding:4px;display:flex;align-items:center;justify-content:center;min-height:70px}.skill .pic img{width:100%;height:auto;max-height:150px;object-fit:contain;display:block}.skill .st{display:grid;grid-template-columns:repeat(2,auto);gap:0 14px;justify-content:start}
.slot{display:flex;justify-content:space-between;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:900;background:#fff}
.slot.empty{opacity:.45}.ok{color:#2a9d3f}.wait{color:#999}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-weight:900}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#fffdf2;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;font-weight:900;z-index:20;box-shadow:0 5px 0 var(--ink);text-align:center}
#tut{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(255,253,242,.96);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:900;z-index:15;display:flex;gap:12px;align-items:center;max-width:92%;font-size:clamp(14px,2.4vw,20px)}
#netbar{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:16;background:#c62d1f;color:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.corner{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;width:42px;height:42px;min-height:0;padding:0;font-size:18px;border-radius:12px}.corner:active{transform:translateX(-50%) translateY(4px)}
/* ---------- 技能按钮（5 个，单排；图片 object-fit:contain，不拉伸不裁切） ---------- */
#controls{flex:0 0 auto;height:22vh;display:flex;gap:10px;padding:6px 0 8px;box-sizing:border-box;touch-action:manipulation}
#controls[hidden]{display:none!important}
.pad{flex:1;display:flex;gap:clamp(5px,1.2vw,14px);min-width:0;height:100%}
.gb{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;padding:clamp(3px,.8vh,8px) clamp(3px,.6vw,8px);
  font:inherit;font-weight:900;color:var(--ink);background:linear-gradient(#fffdf2,#dff0ff);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink),inset 0 0 0 2px rgba(255,255,255,.7);cursor:pointer;
  touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .06s,box-shadow .06s,filter .15s;overflow:hidden;box-sizing:border-box}
.gb.dg{flex-grow:1.18;background:linear-gradient(#e6f6ff,#a9dcff)}
.gb.k-kick{background:linear-gradient(#fff6cf,#ffd34d)}.gb.k-bear{background:linear-gradient(#ffe6d6,#ffb08a)}.gb.k-wobble{background:linear-gradient(#eaffe6,#a9e8a0)}
.gb .im{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.gb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.gb .fb{font-size:clamp(20px,5vh,40px);line-height:1}
.gb .nm{flex:0 0 auto;font-size:clamp(10px,1.9vh,17px);line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.gb .kh{display:none;position:absolute;top:3px;left:5px;font-size:12px;font-weight:900;background:var(--ink);color:#fff;border-radius:6px;padding:0 6px;line-height:18px}
body.dev-desktop .gb .kh{display:block}
.gb .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4.2vh,34px);color:#fff;text-shadow:0 2px 0 #000;background:rgba(20,30,45,.62);pointer-events:none}
.gb .cd:empty{display:none}
.gb.cdon{filter:saturate(.5)}
.gb.down{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 var(--ink)}
.gb.pop{animation:gbpop .28s ease-out}
@keyframes gbpop{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
body.dev-desktop .gb:hover{filter:brightness(1.06)}
.pad.p2 .nm{font-size:clamp(9px,1.5vh,13px)}.pad.p2 .kh{display:none}
/* ---------- 舞台上的图片提示：小图标放大、等级提升 ---------- */
.ipop{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-100%);animation:ipop .75s ease-out forwards;width:clamp(84px,15vw,190px)}
.ipop img{width:100%;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
@keyframes ipop{0%{opacity:0;transform:translate(-50%,-70%) scale(.5)}25%{opacity:1;transform:translate(-50%,-100%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-110%) scale(.95)}100%{opacity:0;transform:translate(-50%,-130%) scale(.5)}}
#lvl{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;pointer-events:none}
#lvl .card2{background:rgba(15,24,34,.88);border:5px solid var(--yellow);border-radius:22px;padding:clamp(8px,2vh,18px) clamp(14px,3vw,32px);display:flex;flex-direction:column;align-items:center;gap:clamp(2px,1vh,8px);max-width:90%;max-height:94%;box-sizing:border-box;animation:lvin .45s cubic-bezier(.2,1.4,.4,1)}
#lvl img{width:min(420px,62vw);max-height:30vh;height:auto;object-fit:contain}
#lvl .t1{font-size:clamp(26px,6vh,54px);font-weight:900;color:var(--yellow);text-shadow:0 3px 0 var(--ink);line-height:1}
#lvl .t2{font-size:clamp(16px,3.4vh,30px);font-weight:900;color:#fff;line-height:1.1}
@keyframes lvin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 5px 0 var(--ink);text-align:center;font-weight:900;width:min(320px,80vw);transform:translate(-50%,-100%)}
#tip img{width:100%;height:auto;max-height:130px;object-fit:contain;display:block}
#tip small{display:block;font-weight:700;opacity:.75;margin-top:2px}
#rotate{position:fixed;inset:0;background:#14202e;z-index:99;display:none;flex-direction:column;gap:16px;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-align:center;padding:24px}
#rotate.show{display:flex}#rotate .ph{font-size:64px}
.logo{display:block;width:min(560px,78vw);max-width:100%;max-height:34vh;height:auto;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
/* ---------- 设备 / 方向 布局 ---------- */
body.dev-desktop #controls{height:clamp(104px,21vh,176px)}
body.dev-phone.orient-landscape #controls{height:33%;padding:4px 0 6px}
body.dev-phone.orient-landscape #stage{margin-top:0}
body.dev-tablet.orient-landscape #controls{height:30%;padding:8px 0 12px}
body.dev-tablet.orient-landscape .pad{gap:clamp(10px,2vw,28px)}
body.dev-tablet.orient-landscape .gb{border-radius:22px}
body.orient-portrait #controls{height:40%}
body.orient-portrait .pad{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1.2fr 1fr;gap:8px}
body.orient-portrait .gb[data-k=dodgeL]{grid-column:1/4;grid-row:1}body.orient-portrait .gb[data-k=dodgeR]{grid-column:4/7;grid-row:1}
body.orient-portrait .gb[data-k=kick]{grid-column:1/3;grid-row:2}body.orient-portrait .gb[data-k=bear]{grid-column:3/5;grid-row:2}body.orient-portrait .gb[data-k=wobble]{grid-column:5/7;grid-row:2}
body.orient-portrait .gb .nm{font-size:clamp(12px,1.9vh,17px)}
body.orient-portrait #controls.two{flex-direction:column;height:44%}
body.orient-portrait #controls.two .pad{display:flex;flex-direction:row}
body.orient-portrait .corner{top:6px}
body.orient-portrait .menu{grid-template-columns:1fr 1fr}
body.dev-phone.orient-landscape .menu{grid-template-columns:repeat(3,minmax(96px,170px));gap:6px 8px}
body.dev-phone.orient-landscape .menu .btn{padding:6px 8px;min-height:36px;font-size:14px}
body.dev-phone.orient-landscape .menu .btn.hero{padding:6px 20px}
body.dev-phone.orient-landscape .logo{max-height:30vh;width:min(360px,50vw)}
body.dev-phone.orient-landscape .overlay{gap:6px;padding:6px}
body.dev-phone.orient-landscape .tag{font-size:12px}
body.orient-portrait .skill{grid-template-columns:1fr}
</style>
<div id="app">
  <div id="stage">
    <canvas id="c" width="800" height="450"></canvas>
    <div id="lvl" hidden></div>
    <button class="btn corner" id="pauseBtn" aria-label="暂停" hidden>⏸</button>
    <div id="tut" hidden><span id="tutText"></span><button class="btn sm" id="tutSkip">跳过教学</button></div>
    <div id="netbar" hidden></div>
    <div class="overlay" id="scr"></div>
  </div>
  <div id="controls" hidden></div>
</div>
<div id="rotate"><div class="ph">📱</div><div>建议横向使用手机进行游戏</div><button class="btn hero" id="rotOk">继续使用竖屏</button></div>
<div id="tip" hidden></div>

    SKILL_KEYS.forEach(k => { skills[k] = { lv: 1, xp: 0, uses: 0, ok: 0, fail: 0 }; });
    return {
      v: 1,
      player: { lv: 1, xp: 0 },
      skills,
      badges: {},
      stats: { dodge: 0, dodgeFail: 0, dodgeStreakBest: 0, perfect: 0, perfectBest: 0, kickHit: 0, kickStreakBest: 0, wobble: 0, bear: 0,
        wins: 0, losses: 0, matches: 0, dbWins: 0, mpWins: 0, maxCombo: 0, damage: 0, masterWins: 0, bounceBest: 0 },
      settings: { master: 0.8, music: 0.6, sfx: 1, voice: 1, muted: false, musicOn: true, sfxOn: true, voiceOn: true, diff: 1, mode: 'ai' },
      tutorialDone: false,
      server: ''
    };
  }

  const num = (v, d, min, max) => { v = Number(v); return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : d; };
  const bool = (v, d) => (typeof v === 'boolean' ? v : d);

  // 逐字段校验，任何异常字段回退为默认值
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('bad');
    const d = def();
    d.player.lv = Math.floor(num(raw.player && raw.player.lv, 1, 1, 999));
    d.player.xp = Math.floor(num(raw.player && raw.player.xp, 0, 0, 1e9));
    SKILL_KEYS.forEach(k => {
      const s = raw.skills && raw.skills[k];
      d.skills[k].lv = Math.floor(num(s && s.lv, 1, 1, 10));
      d.skills[k].xp = Math.floor(num(s && s.xp, 0, 0, 1e6));
      d.skills[k].uses = Math.floor(num(s && s.uses, 0, 0, 1e9));
      d.skills[k].ok = Math.floor(num(s && s.ok, 0, 0, 1e9));
      d.skills[k].fail = Math.floor(num(s && s.fail, 0, 0, 1e9));
    });
    for (const k in d.stats) d.stats[k] = Math.floor(num(raw.stats && raw.stats[k], 0, 0, 1e9));
    if (raw.badges && typeof raw.badges === 'object') {
      for (const id in raw.badges) { const b = raw.badges[id]; if (b && Number.isFinite(b.ts)) d.badges[String(id).slice(0, 30)] = { ts: b.ts }; }
    }
    const s = raw.settings || {};
    ['master', 'music', 'sfx', 'voice'].forEach(k => { d.settings[k] = num(s[k], d.settings[k], 0, 1); });
    ['muted', 'musicOn', 'sfxOn', 'voiceOn'].forEach(k => { d.settings[k] = bool(s[k], d.settings[k]); });
    d.settings.diff = Math.floor(num(s.diff, 1, 0, 3));
    d.settings.mode = ['ai', 'double', 'local2p', 'village'].includes(s.mode) ? s.mode : 'ai';
    d.tutorialDone = bool(raw.tutorialDone, false);
    d.server = typeof raw.server === 'string' ? raw.server.slice(0, 120) : '';
    return d;
  }

  const store = { data: def(), recovered: false, ok: true };

  store.load = () => {
    let text = null;
    try { text = localStorage.getItem(KEY); } catch (e) { store.ok = false; }
    if (!text) return store.data;
    try {
      store.data = sanitize(JSON.parse(text));
    } catch (e) {
      store.data = def();
      store.recovered = true;
      store.flush();
    }
    return store.data;
  };
  store.flush = () => {
    try { localStorage.setItem(KEY, JSON.stringify(store.data)); store.ok = true; } catch (e) { store.ok = false; }
  };
  store.save = () => {
    if (timer) return;
    timer = setTimeout(() => { timer = null; store.flush(); }, 400);
  };
  store.reset = () => { store.data = def(); store.flush(); };

  window.addEventListener('pagehide', () => store.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) store.flush(); });
  return store;
})();

const Prog = (() => {
  const S = () => Store.data;
  const handlers = { level: null, plevel: null, badge: null };
  const P = {
    BADGES,
    match: null,
    on(name, fn) { handlers[name] = fn; },
    resetMatch() {
      P.match = { damage: 0, dodge: 0, perfect: 0, kicks: 0, kickHit: 0, maxCombo: 0, uses: 0, xp: 0, badges: [] };
    },
    // 累加存档统计，并检查 Badge
    record(stat, n = 1) {
      const st = S().stats;
      st[stat] = (st[stat] || 0) + n;
      if (P.match && stat in P.match) P.match[stat] += n;
      P.check();
    },
    best(stat, val) {
      const st = S().stats;
      if (val > (st[stat] || 0)) { st[stat] = val; P.check(); }
    },
    check() {
      let changed = false;
      for (const b of BADGES) {
        if (!S().badges[b.id] && (S().stats[b.stat] || 0) >= b.goal) {
          S().badges[b.id] = { ts: Date.now() };
          if (P.match) P.match.badges.push(b.id);
          if (handlers.badge) handlers.badge(b);
          changed = true;
        }
      }
      Store.save();
      return changed;
    },
    // 技能使用次数（每个技能一份，闪身步左右共享）
    use(key) { S().skills[key].uses++; Store.save(); },
    // 闪身判定结果：成功/失败计数（左右共享），连续成功 DODGE xN
    dodgeResult(ok) { const d = S().skills.dodge; if (ok) d.ok++; else d.fail++; Store.save(); },
    progress(b) { return Math.min(b.goal, S().stats[b.stat] || 0); },
    // 动作熟练度：Combo 越高 XP 越多
    addSkillXp(key, amount, combo = 0) {
      const n = Math.max(1, Math.round(amount * (1 + 0.05 * Math.min(combo, 20))));
      const s = S().skills[key];
      if (s.lv < 10) {
        s.xp += n;
        while (s.lv < 10 && s.xp >= Skills.skillNeed(s.lv)) {
          s.xp -= Skills.skillNeed(s.lv);
          s.lv++;
          if (handlers.level) handlers.level(key, s.lv);
        }
        if (s.lv >= 10) s.xp = 0;
      }
      if (P.match) P.match.xp += n;
      P.addPlayerXp(Math.round(n * 0.6));
      Store.save();
      return n;
    },
    addPlayerXp(n) {
      const p = S().player;
      p.xp += n;
      while (p.xp >= Skills.playerNeed(p.lv)) {
        p.xp -= Skills.playerNeed(p.lv);
        p.lv++;
        if (handlers.plevel) handlers.plevel(p.lv);
      }
    }
  };
  P.resetMatch();
  return P;
})();

  const imgs = {}, A = {};
  for (const k in ASSET_URIS) {
    const im = new Image();

    if (!ctx) return;
    master.gain.value = opt.muted ? 0 : opt.master;
    busM.gain.value = opt.musicOn ? opt.music : 0;
    busS.gain.value = opt.sfxOn ? opt.sfx : 0;
    busV.gain.value = opt.voiceOn ? opt.voice : 0;
  }

  function init() {
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); busM = ctx.createGain(); busS = ctx.createGain(); busV = ctx.createGain();
        busM.connect(master); busS.connect(master); busV.connect(master);
        const lim = ctx.createDynamicsCompressor();      // 防止爆音
        lim.threshold.value = -8; lim.ratio.value = 12;
        master.connect(lim); lim.connect(ctx.destination);
        applyVolumes();
      }
      if (ctx.state === 'suspended') ctx.resume();
      loadClips();
    } catch (e) { ctx = null; }
  }

  // 解码从参考视频中提取的原声片段（base64 mp3 → AudioBuffer）
  function loadClips() {
    if (loaded || !ctx || typeof VOICE_CLIPS === 'undefined') return;
    loaded = true;
    for (const k in VOICE_CLIPS) {
      try {
        const bin = atob(VOICE_CLIPS[k].split(',')[1]);
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const p = ctx.decodeAudioData(u8.buffer, b => { buffers[k] = b; }, () => {});
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
  }
  // force=true：立即打断当前语音；否则只在没有语音时播放（AI）
  function playClip(name, vol = 1, force = false) {
    if (!ctx || !opt.voiceOn || !buffers[name]) return false;
    if (cur && !force) return false;
    if (cur) { try { cur.stop(); } catch (e) {} }
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buffers[name];
    g.gain.value = 0.85 * vol;
    src.connect(g); g.connect(busV);
    src.onended = () => { if (cur === src) cur = null; };
    cur = src;
    src.start();
    return true;
  }

  function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, when = 0, bus = null) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(bus || busS);
    o.start(t); o.stop(t + dur + 0.02);
  }

  let noiseBuf = null;
  function noise(dur, vol = 0.2, freq = 1200, sweep = 0, when = 0, q = 1, bus = null) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq + sweep), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(bus || busS);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function sfx(name) {
    if (!ctx) return;
    switch (name) {
      case 'kick':    noise(0.05, 0.5, 2500); tone(180, 0.08, 'triangle', 0.3, -60); break;          // 啪！
      case 'whoosh':  noise(0.35, 0.35, 400, 2400, 0, 0.8); break;                                   // 咻——！
      case 'hit':     tone(140, 0.25, 'sine', 0.8, -90); noise(0.12, 0.4, 600); break;               // 砰！
      case 'perfect': tone(1320, 0.35, 'sine', 0.25); tone(1760, 0.5, 'sine', 0.15, 0, 0.05); break; // 叮！
      case 'bear':    for (let i = 0; i < 6; i++) noise(0.03, 0.4, 3000, 0, i * 0.045, 2); break;    // 哒哒哒！
      case 'boom':    tone(90, 0.6, 'sine', 0.9, -60); noise(0.5, 0.6, 300, -200); break;           // 轰！
      case 'fail':    tone(330, 0.12, 'triangle', 0.35, -180); tone(200, 0.22, 'sawtooth', 0.2, -120, 0.1); break;   // 哎呀
      case 'wobble':  tone(300, 0.5, 'sine', 0.15, 200); tone(450, 0.5, 'sine', 0.12, -200, 0.1); break;
      case 'step':    noise(0.03, 0.12, 900, 0, 0, 2); break;
      case 'bounce':  tone(260, 0.12, 'triangle', 0.35, 160); break;
      case 'click':   tone(700, 0.05, 'square', 0.12); break;
      case 'back':    tone(420, 0.06, 'square', 0.1); break;
      case 'combo':   tone(880, 0.1, 'square', 0.15); tone(1175, 0.16, 'square', 0.15, 0, 0.08); break;
      case 'levelup': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, 'triangle', 0.25, 0, i * 0.08)); break;
      case 'badge':   [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.22, 'sine', 0.22, 0, i * 0.09)); break;
      case 'ready':   tone(660, 0.12, 'square', 0.2); break;
      case 'tick':    tone(520, 0.1, 'square', 0.2); break;
      case 'go':      tone(990, 0.4, 'square', 0.25); tone(1480, 0.4, 'square', 0.15, 0, 0.02); break;
      case 'win':     [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.18, 0, i * 0.12)); break;
      case 'lose':    [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.25, 0, i * 0.18)); break;
    }
  }

  // 背景音乐：鼓点 + 偏民间的五声音阶旋律（唢呐感方波）
  const MELODY = [0, 2, 4, 2, 0, -1, 0, 2, 4, 5, 4, 2, 0, 2, 1, 0];
  const BASE = 261.6;
  const semi = n => BASE * Math.pow(2, [0, 2, 4, 7, 9][((n % 5) + 5) % 5] / 12 + Math.floor(n / 5));
  function musicTick() {
    if (!ctx) { step++; return; }
    const s = step % 16;
    if (s % 4 === 0) tone(120, 0.12, 'sine', 0.8, -50, 0, busM);
    if (s === 4 || s === 12) noise(0.1, 0.5, 1800, 0, 0, 1, busM);
    noise(0.03, 0.12, 7000, 0, 0, 1, busM);
    if (s % 2 === 1) tone(semi(MELODY[(step >> 1) % 16]) * 2, 0.12, 'square', 0.04, 0, 0, busM);
    step++;
  }
  function startMusic() { stopMusic(); step = 0; musicTimer = setInterval(musicTick, 60000 / bpm / 4); }
  function stopMusic() { if (musicTimer) clearInterval(musicTimer); musicTimer = null; }
  function setIntensity(combo) {
    const nb = 150 + Math.min(combo, 20) * 2.5;
    if (Math.abs(nb - bpm) > 1) { bpm = nb; if (musicTimer) startMusic(); }
  }

  // 仅用于少量普通短句（不用于闪身步等有原声的动作）
  function speak(text) {
    if (!opt.voiceOn || opt.muted) return;
    try {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = 1.25; u.pitch = 1.4; u.volume = Math.min(1, 0.9 * opt.voice * opt.master);
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  return {
    init, sfx, speak, playClip, opt, startMusic, stopMusic, setIntensity,
    // 设置接口
    apply(s) { Object.assign(opt, s); applyVolumes(); },
    set(k, v) { opt[k] = v; applyVolumes(); },
    isRunning() { return !!musicTimer; }
  };
})();

// 轻量粒子：速度线、灰尘、冲击波、闪光、星星、地面裂纹。数量有上限，保证平板流畅。
const FX = (() => {
  const GROUND = 575;
  const coarse = typeof matchMedia !== 'undefined' && matchMedia('(pointer:coarse)').matches;
  const MAX = coarse ? 90 : 160;
  let list = [];

  function add(p) {
    if (list.length >= MAX) list.shift();
    p.t = 0; p.life = p.life || 0.5;
    list.push(p);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  const api = {
    clear() { list = []; },
    burst(x, y, n, color, kind = 'star', spd = 320) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = rnd(spd * 0.3, spd);
        add({ kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, color, size: rnd(6, 14), life: rnd(0.4, 0.8), rot: Math.random() * 6 });
      }
    },
    dust(x, n = 6) {
      for (let i = 0; i < n; i++) add({ kind: 'dust', x: x + rnd(-30, 30), y: GROUND + 2, vx: rnd(-90, 90), vy: rnd(-90, -20), color: '#e9f4ff', size: rnd(8, 16), life: rnd(0.3, 0.6) });
    },
    // 闪身步速度线（水平）
    speedLines(x, y, dir, n = 7) {
      for (let i = 0; i < n; i++) add({ kind: 'line', x: x - dir * rnd(0, 50), y: y + rnd(-110, 90), vx: -dir * rnd(500, 900), vy: 0, color: '#ffffff', size: rnd(40, 90), life: rnd(0.15, 0.3) });
    },
    ring(x, y, maxR, color, life = 0.5, flat = 0.22) { add({ kind: 'ring', x, y, maxR, color, life, flat, size: 8 }); },
    crack(x, life = 1.4) { add({ kind: 'crack', x, y: GROUND + 6, life, color: '#2b3a55', size: rnd(70, 110), seed: Math.random() * 100 }); },
    flash(x, y, r, color = '#fff') { add({ kind: 'flash', x, y, maxR: r, color, life: 0.18 }); },
    confetti(n = 30) {
      for (let i = 0; i < n; i++) add({ kind: 'conf', x: rnd(100, 1180), y: rnd(-60, 0), vx: rnd(-60, 60), vy: rnd(120, 260), color: ['#ffe14a', '#f2602a', '#6cc7ff', '#8fe08a', '#ff9ee0'][i % 5], size: rnd(8, 14), life: rnd(1.2, 2), rot: Math.random() * 6 });
    },
    update(dt) {
      for (const p of list) {
        p.t += dt;
        if (p.vx !== undefined) { p.x += p.vx * dt; p.y += (p.vy || 0) * dt; }
        if (p.kind === 'star' || p.kind === 'spark' || p.kind === 'conf') p.vy += 500 * dt;
        p.rot = (p.rot || 0) + dt * 6;
      }
      list = list.filter(p => p.t < p.life);
    },
    draw(g) {
      for (const p of list) {
        const a = 1 - p.t / p.life, k = p.t / p.life;
        g.save();
        g.globalAlpha = Math.max(0, a);
        switch (p.kind) {
          case 'star': case 'conf': case 'spark':
            g.translate(p.x, p.y); g.rotate(p.rot);
            g.fillStyle = p.color;
            if (p.kind === 'star') { g.beginPath(); for (let i = 0; i < 5; i++) { const aa = i * 1.2566 - 1.57; g.lineTo(Math.cos(aa) * p.size, Math.sin(aa) * p.size); const bb = aa + 0.628; g.lineTo(Math.cos(bb) * p.size * 0.45, Math.sin(bb) * p.size * 0.45); } g.fill(); }
            else g.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            break;
          case 'dust':
            g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.size * (0.6 + k), 0, 6.3); g.fill(); break;
          case 'line':
            g.strokeStyle = p.color; g.lineWidth = 3; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + Math.sign(p.vx) * p.size, p.y); g.stroke(); break;
          case 'ring': {
            const r = p.maxR * k;
            g.strokeStyle = p.color; g.lineWidth = 10 * a + 2;
            g.beginPath(); g.ellipse(p.x, p.y, r, r * p.flat, 0, 0, 6.3); g.stroke(); break;
          }
          case 'flash': {
            const r = p.maxR * (0.4 + k);
            const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
            gr.addColorStop(0, p.color); gr.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, r, 0, 6.3); g.fill(); break;
          }
          case 'crack': {   // 卡通裂纹（折线）
            g.strokeStyle = p.color; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
            g.globalAlpha = Math.min(1, a * 2);
            for (let i = -1; i <= 1; i += 2) {
              g.beginPath(); let x = p.x, y = p.y; g.moveTo(x, y);
              for (let s = 0; s < 4; s++) { x += i * (p.size / 4); y += ((Math.sin(p.seed + s * 2.1 + i) * 7)) + 3; g.lineTo(x, y); }
              g.stroke();
            }
            break;
          }
        }
        g.restore();
      }
    }
  };
  return api;
})();

// 绘制：参考视频风格的蓝色摄影棚（带视差）+ 原创卡通化 2D 角色（Canvas 程序化骨骼动画）
const Draw = (() => {
  const W = 1280, H = 720, GROUND = 575;
  const FH = { thigh: 62, shin: 60, torso: 66, upper: 44, fore: 40, head: 24 };
  let ctx = null;
  const setCtx = c => { ctx = c; };

  const PAL = {
    p: { tee: '#f6f5ef', trim: '#2b3a55', pants: '#c8b48e', skin: '#e9b993', hair: '#2a2420', shoe: '#2c2622' },
    a: { tee: '#9aa9b2', trim: '#5f6f7a', pants: '#2e2f3a', skin: '#d8a07a', hair: '#1c1816', shoe: '#17151a', pattern: true }
  };
  // 村民配色（全村大乱斗 / 队友）
  const TEES = ['#e8573f', '#f2b134', '#5bb36b', '#6aa8e8', '#b583e0', '#f08fb0'];
  const PANTS = ['#2e2f3a', '#7a6a4f', '#3a4a6b', '#4b5d3a', '#5a3a3a', '#2c5a5a'];
  function villagerPal(i) {
    return { tee: TEES[i % 6], trim: '#1b1a22', pants: PANTS[(i * 5 + 2) % 6], skin: ['#e9b993', '#d8a07a', '#c68f6a'][i % 3], hair: '#201a16', shoe: '#1b1a22', pattern: i % 2 === 0 };
  }

  const ease = t => t * t * (3 - 2 * t);

  // ---------- 背景：远景 / 中景 / 地面，轻微视差 ----------
  function background(shake, camx = 640, up = 0, down = 0, side = 60) {
    const g = ctx, off = (camx - 640);
    g.save();
    g.translate(shake.x, shake.y);
    const wall = g.createLinearGradient(0, 0, 0, GROUND);
    wall.addColorStop(0, '#a9d6f5'); wall.addColorStop(0.6, '#6aaee3'); wall.addColorStop(1, '#4a8fcc');
    g.fillStyle = wall; g.fillRect(-side, -40 - up, W + 2 * side, GROUND + 40 + up);
    // 远景：大块背景幕布明暗（几乎不动）
    const fx = -off * 0.015;
    g.fillStyle = 'rgba(255,255,255,0.10)';
    for (let i = 0; i < 4; i++) g.fillRect(fx + 20 + i * 330, -up, 150, GROUND + up);
    // 中景：墙缝（轻微移动）
    const mx = -off * 0.04;
    g.strokeStyle = 'rgba(30,80,130,0.22)'; g.lineWidth = 3;
    for (let x = 60; x < W + 170; x += 170) { g.beginPath(); g.moveTo(x + mx, -up); g.lineTo(x + mx, GROUND); g.stroke(); }
    // 顶部聚光
    const spot = g.createRadialGradient(W / 2 + fx * 3, -80, 40, W / 2 + fx * 3, -80, 900);
    spot.addColorStop(0, 'rgba(255,255,255,0.55)'); spot.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = spot; g.fillRect(-side, -40 - up, W + 2 * side, GROUND + 40 + up);
    // 地面
    const floor = g.createLinearGradient(0, GROUND, 0, H);
    floor.addColorStop(0, '#a8c6dc'); floor.addColorStop(1, '#5f86a6');
    g.fillStyle = floor; g.fillRect(-side, GROUND, W + 2 * side, H - GROUND + 40 + down);
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2;
    const gx = -off * 0.09;
    for (let i = 0; i < 9; i++) {
      const y = GROUND + 12 + i * (H - GROUND) / 9;
      g.beginPath(); g.moveTo(80 + i * 26 + gx, y); g.lineTo(W - 80 - i * 26 + gx, y); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(-side, GROUND - 1, W + 2 * side, 3);
    g.restore();
  }

  // ---------- 倒地 / 翻滚动作（variant: 0平躺 1坐地 2转圈 3脸着地 4滑出 5翻滚） ----------
  function fallPose(p, variant, st, getUp) {
    const up = getUp ? 1 - ease(Math.max(0, Math.min(1, (st - 0.55) / 0.4))) : 1;
    p.armL = -1.5; p.armR = 2.2; p.mouth = 'o';
    switch (variant) {
      case 0: p.rot = -Math.PI / 2 * Math.min(1, st * 3) * up; p.sink = 26 * Math.min(1, st * 3) * up; break;
      case 1: p.sink = 44 * Math.min(1, st * 4) * up; p.legL = 1.5; p.legR = 1.4; p.kneeL = -0.2; p.kneeR = -0.2; p.lean = -0.25 * up; p.armL = 0.6; p.armR = 0.8; p.mouth = 'q'; break;
      case 2: p.rot = (st * 14) * (st < 0.7 ? 1 : 0) % (Math.PI * 2) * up; if (st >= 0.7) p.rot = -Math.PI / 2 * up; p.sink = 20 * up; break;
      case 3: p.rot = Math.PI / 2 * Math.min(1, st * 3) * up; p.sink = 26 * Math.min(1, st * 3) * up; p.armL = 1.2; p.armR = 1.4; break;
      case 4: p.rot = -Math.PI / 2.3 * Math.min(1, st * 4) * up; p.sink = 20 * up; break;
      case 5: p.rot = -(st * 16) * (st < 0.8 ? 1 : 0) * up; if (st >= 0.8) p.rot = -Math.PI / 2 * up; p.sink = 22 * up; break;
    }
  }

  // ---------- 姿势 ----------
  function pose(f) {
    const st = f.st, d = f.dur || 1, k = Math.min(1, st / d);
    const p = { lean: 0.05, bob: 0, legL: 0.06, legR: -0.06, kneeL: 0.05, kneeR: 0.05,
      armL: -0.35, armR: 0.9, elL: 0.6, elR: 1.2, tilt: 0, shiver: 0, off: 0, mouth: 'smile', sink: 0, rot: 0 };
    p.bob = Math.sin(f.clock * 3) * 2;
    switch (f.state) {
      case 'idle': case 'ready':
        p.armR = 0.9 + Math.sin(f.clock * 4) * 0.08; p.armL = -0.4; break;
      case 'dodge': {                 // 闪身步：腰胯先动 → 一脚斜迈 → 另一脚跟上 → 扭转 → 并步 → 刹住
        const e = k < 0.3 ? k / 0.3 : 1 - (k - 0.3) / 0.7;
        p.lean = -0.12 * e * f.dir * f.facing + 0.05;
        p.legL = 0.7 * f.dir * (1 - k) - 0.2; p.legR = -0.5 * f.dir * (1 - k) + 0.1;
        p.kneeL = 0.5; p.kneeR = 0.3;
        p.armL = -1.2 * f.dir; p.armR = 1.3 * f.dir; p.elL = 0.2; p.elR = 0.4; p.mouth = 'o';
        p.tilt = Math.sin(k * Math.PI) * 0.4 * f.dir; p.sink = 10 * Math.sin(k * Math.PI);
        break;
      }
      case 'kick': {                  // 浪子踢球：准备 → 重心转移 → 后撩腿 → 前勾踢 → 上身反拧 → 收腿
        if (k < 0.2) { p.lean = -0.12 * k * 5; p.armL = 0.8; p.armR = -0.6; }
        else if (k < 0.45) { const e = (k - 0.2) / 0.25; p.lean = -0.1; p.legR = -0.9 * e; p.kneeR = 1.6 * e; p.armL = 0.9; p.armR = -1.4 * e + 0.2; p.elR = 0.4; }
        else if (k < 0.6) { const e = (k - 0.45) / 0.15; p.lean = -0.1 + 0.35 * e; p.legR = -0.9 + 1.9 * e; p.kneeR = 1.6 - 1.4 * e; p.armL = -1.2; p.armR = 1.6; }
        else { const e = (k - 0.6) / 0.4; p.lean = 0.25 - 0.3 * e; p.legR = 1.0 - 1.0 * e; p.kneeR = 0.2 + 1.2 * e; p.armL = -1.2 + 1.2 * e; p.armR = 1.6 - 1.0 * e; }
        p.legL = 0.08; p.kneeL = 0.2; p.mouth = 'shout';
        break;
      }
      case 'bear': {                  // 狗熊哆嗦毛：屈膝 → 疯狂抖动 → 释放
        if (k < 0.3) { const e = k / 0.3; p.sink = 22 * e; p.kneeL = 0.6 * e; p.kneeR = 0.6 * e; p.legL = 0.25; p.legR = -0.25; p.armL = -0.9; p.armR = 0.9; }
        else if (k < 0.9) {
          p.sink = 22; p.kneeL = 0.6; p.kneeR = 0.6; p.legL = 0.25; p.legR = -0.25;
          p.lean = Math.sin(f.clock * 70) * 0.1;
          p.armL = -0.9 + Math.sin(f.clock * 60) * 0.5; p.armR = 0.9 - Math.sin(f.clock * 60) * 0.5;
          p.tilt = Math.sin(f.clock * 55) * 0.3; p.off = Math.sin(f.clock * 60) * 3; p.mouth = 'shout';
        } else { p.sink = 10; p.armL = 1.4; p.armR = 1.4; p.elL = 0.1; p.elR = 0.1; p.mouth = 'shout'; }
        break;
      }
      case 'wobble': {                // 摇头晃脑：肩膀带动身体，头随之晃
        const s = Math.sin(f.clock * 9);
        p.lean = 0.12 * s; p.tilt = 0.35 * Math.sin(f.clock * 9 - 0.6);
        p.armL = -0.5 + 0.5 * s; p.armR = 0.7 - 0.5 * s; p.mouth = 'q';
        p.legL = 0.15 * s; p.legR = -0.15 * s;
        break;
      }
      case 'stumble': {               // 闪身失败：5 种搞笑变体（0踉跄 1打滑 2反向晃 3快速抖 4差点闪过）
        const v = f.variant | 0, w = Math.sin(st * 22), fade = 1 - k * 0.5;
        p.mouth = 'o';
        if (v === 0) { p.lean = (0.3 * Math.sin(st * 14)) * fade; p.armL = -1.6 + w; p.armR = 1.8 - w; p.legL = 0.4 * w; p.legR = -0.4 * w; p.kneeL = 0.5; p.kneeR = 0.4; }
        else if (v === 1) { p.lean = -0.4 * Math.sin(Math.min(1, k * 1.6) * Math.PI * 0.7); p.legL = 0.9 * f.dir; p.legR = -0.4 * f.dir; p.kneeL = 0.2; p.armL = -1.8; p.armR = 1.9; p.sink = 12 * Math.sin(k * Math.PI); }
        else if (v === 2) { p.lean = 0.28 * -f.dir * f.facing * Math.sin(k * Math.PI); p.tilt = -0.35 * f.dir * Math.sin(k * Math.PI); p.armL = 1.4 * w; p.armR = -1.4 * w; p.legL = -0.5 * f.dir; p.legR = 0.3 * f.dir; p.kneeL = 0.4; }
        else if (v === 3) { p.off = Math.sin(st * 70) * 7 * fade; p.tilt = Math.sin(st * 60) * 0.25 * fade; p.armL = -1.2 + w * 0.6; p.armR = 1.2 - w * 0.6; p.mouth = 'shout'; }
        else { const e = Math.sin(Math.min(1, k * 1.2) * Math.PI); p.lean = -0.1 * f.dir * f.facing * e; p.legL = 0.6 * f.dir * e; p.legR = -0.4 * f.dir * e; p.kneeL = 0.4; p.armL = -1.0 * f.dir; p.armR = 1.1 * f.dir; p.tilt = 0.25 * f.dir * e; p.mouth = 'q'; }
        break;
      }
      case 'dance': {                 // 全员跳舞
        const s = Math.sin(f.clock * 10);
        p.armL = 2.4 + s * 0.6; p.armR = 2.4 - s * 0.6; p.legL = 0.35 * s; p.legR = -0.35 * s; p.kneeL = 0.5; p.kneeR = 0.5;
        p.tilt = 0.25 * s; p.bob = Math.abs(s) * 8; p.off = s * 14; p.mouth = 'shout';
        break;
      }
      case 'hit': {
        const e = Math.min(1, st * 6);
        p.lean = -0.35 * e; p.armL = -1.4; p.armR = 1.6; p.mouth = 'o'; p.tilt = -0.3 * e;
        break;
      }
      case 'tumble': fallPose(p, f.variant || 0, st, true); break;
      case 'down':   fallPose(p, f.variant || 0, st, false); break;
      case 'win': {
        const s = Math.sin(f.clock * 12);
        p.armL = 2.6 + s * 0.3; p.armR = -2.6 + s * 0.3; p.mouth = 'shout'; p.legL = 0.2 * s; p.legR = -0.2 * s; p.bob = Math.abs(s) * 6;
        break;
      }
      case 'lose': p.tilt = 0.3; p.armL = 0.2; p.armR = 0.4; p.mouth = 'q'; p.lean = 0.2; break;
    }
    if (f.shiver > 0) {               // 被狗熊哆嗦毛震到：左右摇摆
      const a = Math.min(1, f.shiver / 0.6);
      p.tilt += Math.sin(f.clock * 45) * 0.28 * a;
      p.off += Math.sin(f.clock * 45) * 6 * a;
    }
    if (f.confused > 0 && f.state === 'idle') {   // 迷惑：晕乎乎
      p.tilt += Math.sin(f.clock * 7) * 0.25; p.off += Math.sin(f.clock * 5) * 5; p.mouth = 'q';
    }
    return p;
  }

  // ---------- 人物 ----------
  function fighter(f, alpha = 1) {
    const g = ctx, c = f.pal, p = pose(f);
    const fx = f.facing, sc = f.scale || 1;
    // 地面阴影
    g.save();
    g.globalAlpha = 0.22 * alpha; g.fillStyle = '#10243a';
    g.beginPath(); g.ellipse(f.x + p.off, GROUND + 8, 52 * sc, 10 * sc, 0, 0, 6.3); g.fill();
    g.restore();
    g.save();
    g.globalAlpha = alpha;
    g.translate(f.x + p.off, GROUND);
    g.scale(sc, sc);
    if (p.rot) { g.translate(0, -30); g.rotate(p.rot * fx); g.translate(0, 30); }
    g.scale(fx, 1);
    const hip = { x: 0, y: -(FH.thigh + FH.shin) + p.sink + p.bob * 0.5 };
    const seg = (a, b, color, w) => {
      g.strokeStyle = '#1b1a22'; g.lineWidth = w + 5; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      g.strokeStyle = color; g.lineWidth = w;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    };
    const fk = (p0, len, ang) => ({ x: p0.x + Math.sin(ang) * len, y: p0.y + Math.cos(ang) * len });
    const leg = (ang, knee) => { const kn = fk(hip, FH.thigh, ang); return { kn, ft: fk(kn, FH.shin, ang + knee) }; };
    const L = leg(p.legL, p.kneeL), R = leg(p.legR, p.kneeR);
    const drawLeg = lg => {
      seg(hip, lg.kn, c.pants, 17); seg(lg.kn, lg.ft, c.pants, 15);
      g.fillStyle = c.shoe; g.beginPath(); g.ellipse(lg.ft.x + 8, lg.ft.y + 2, 13, 6, 0, 0, 6.3); g.fill();
    };
    drawLeg(fx > 0 ? R : L);
    const lean = p.lean + p.shiver * 0.3;
    const sh = { x: hip.x + Math.sin(lean) * FH.torso, y: hip.y - Math.cos(lean) * FH.torso };
    const headC = { x: sh.x + Math.sin(lean + p.tilt) * FH.head * 1.05, y: sh.y - Math.cos(lean + p.tilt) * FH.head * 1.05 - 4 };
    const aBack = fx > 0 ? p.armL : p.armR, aFront = fx > 0 ? p.armR : p.armL;
    const eBack = fx > 0 ? p.elL : p.elR, eFront = fx > 0 ? p.elR : p.elL;
    const sB = { x: sh.x - 2, y: sh.y + 4 }, sF = { x: sh.x + 2, y: sh.y + 4 };
    const eb = fk(sB, FH.upper, aBack), hb = fk(eb, FH.fore, aBack + eBack);
    seg(sB, eb, c.tee, 13); seg(eb, hb, c.skin, 11);
    seg(hip, sh, c.tee, 34);
    g.strokeStyle = c.trim; g.lineWidth = 4;
    g.beginPath(); g.moveTo(sh.x - 6, sh.y + 2); g.lineTo(sh.x + Math.sin(lean) * 8 + 2, sh.y + 12); g.lineTo(sh.x + 6, sh.y + 2); g.stroke();
    if (c.pattern) {
      g.strokeStyle = 'rgba(40,60,70,0.45)'; g.lineWidth = 2;
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(hip.x - 10, hip.y - 14 - i * 12); g.lineTo(hip.x + 10, hip.y - 14 - i * 12); g.stroke(); }
    }
    drawLeg(fx > 0 ? L : R);
    const ef = fk(sF, FH.upper, aFront), hf = fk(ef, FH.fore, aFront + eFront);
    seg(sF, ef, c.tee, 13); seg(ef, hf, c.skin, 11);
    g.fillStyle = '#1b1a22'; g.beginPath(); g.arc(headC.x, headC.y, FH.head + 2.5, 0, 6.3); g.fill();
    g.fillStyle = c.skin; g.beginPath(); g.arc(headC.x, headC.y, FH.head, 0, 6.3); g.fill();
    g.fillStyle = c.hair; g.beginPath(); g.arc(headC.x - 4, headC.y - 2, FH.head - 1, Math.PI * 0.55, Math.PI * 1.25); g.fill();
    g.fillStyle = '#1b1a22'; g.beginPath(); g.arc(headC.x + 9, headC.y - 3, 2.2, 0, 6.3); g.fill();
    g.strokeStyle = '#1b1a22'; g.lineWidth = 2; g.beginPath();
    if (p.mouth === 'o') { g.fillStyle = '#5a1f1f'; g.arc(headC.x + 12, headC.y + 9, 3.5, 0, 6.3); g.fill(); }
    else if (p.mouth === 'shout') { g.fillStyle = '#5a1f1f'; g.ellipse(headC.x + 12, headC.y + 9, 4, 6, 0, 0, 6.3); g.fill(); }
    else if (p.mouth === 'q') { g.moveTo(headC.x + 8, headC.y + 11); g.lineTo(headC.x + 15, headC.y + 11); g.stroke(); }
    else { g.arc(headC.x + 11, headC.y + 8, 5, 0.2, Math.PI - 0.6); g.stroke(); }
    g.restore();
  }

  // 头顶小血条 / 名字（联机、2v2、全村大乱斗）
  function tag(f, showBar) {
    const g = ctx;
    if (f.hp <= 0 && f.state === 'down') return;
    const x = f.x, y = GROUND - 275 * (f.scale || 1);
    g.save(); g.textAlign = 'center';
    if (f.name) {
      g.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
      g.lineWidth = 4; g.strokeStyle = '#1b1a22'; g.fillStyle = '#fff';
      g.strokeText(f.name, x, y - 12); g.fillText(f.name, x, y - 12);
    }
    if (showBar) {
      g.fillStyle = 'rgba(15,24,34,.75)'; g.fillRect(x - 32, y - 6, 64, 8);
      g.fillStyle = f.hp / f.maxhp > 0.35 ? '#7fd36b' : '#ff7a59';
      g.fillRect(x - 32, y - 6, 64 * Math.max(0, f.hp) / f.maxhp, 8);
      g.strokeStyle = '#1b1a22'; g.lineWidth = 2; g.strokeRect(x - 32, y - 6, 64, 8);
    }
    g.restore();
  }

  function ball(b) {
    const g = ctx, r = b.r;
    g.save();
    for (let i = 1; i <= 4; i++) {
      g.globalAlpha = 0.12 * (5 - i);
      g.fillStyle = b.big ? '#ff7a59' : '#ffd34d';
      g.beginPath(); g.arc(b.x - b.vx * i * 0.015, b.y - b.vy * i * 0.015, r - i * 2, 0, 6.3); g.fill();
    }
    g.globalAlpha = 1;
    g.translate(b.x, b.y); g.rotate(b.rot);
    g.fillStyle = '#fbfbf7'; g.strokeStyle = '#1b1a22'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, r, 0, 6.3); g.fill(); g.stroke();
    g.fillStyle = b.big ? '#ff7a59' : '#e8453c';
    for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283; g.beginPath(); g.arc(Math.cos(a) * r * 0.53, Math.sin(a) * r * 0.53, r * 0.24, 0, 6.3); g.fill(); }
    g.restore();
  }

  function wave(w) {
    const g = ctx, a = 1 - w.t / w.life, r = w.t / w.life * w.maxR;
    g.save();
    g.globalAlpha = a * 0.8; g.strokeStyle = '#fff3a0'; g.lineWidth = 10 * a + 2;
    g.beginPath(); g.ellipse(w.x, GROUND, r, r * 0.22, 0, 0, 6.3); g.stroke();
    g.globalAlpha = a * 0.4; g.strokeStyle = '#fff'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(w.x, GROUND, r * 0.7, r * 0.15, 0, 0, 6.3); g.stroke();
    g.restore();
  }

  // 技能名字幕条（参考视频底部橙色标签）
  function ribbon(text, alpha, y0 = H - 90) {
    if (!text || alpha <= 0) return;
    const g = ctx;
    g.save(); g.globalAlpha = alpha;
    const grd = g.createLinearGradient(0, 0, 360, 0);
    grd.addColorStop(0, '#f2602a'); grd.addColorStop(1, 'rgba(242,96,42,0)');
    g.fillStyle = grd; g.fillRect(20, y0, 380, 48);
    g.font = 'bold 30px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    g.fillStyle = '#ffe14a'; g.strokeStyle = '#6a2a0a'; g.lineWidth = 4;
    g.strokeText(text, 34, y0 + 34); g.fillText(text, 34, y0 + 34);
    g.restore();
  }

  function popup(p) {
    const g = ctx, a = Math.min(1, p.life / 0.4);
    g.save(); g.globalAlpha = a;
    const grow = p.pop ? 1 + Math.max(0, 0.35 - (p.age || 0)) * 1.5 : 1;
    g.translate(p.x, p.y); g.scale(grow, grow);
    g.font = `900 ${p.size || 44}px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
    g.textAlign = 'center'; g.lineJoin = 'round';
    g.strokeStyle = '#1b1a22'; g.lineWidth = 8;
    g.strokeText(p.text, 0, 0); g.fillStyle = p.color || '#fff'; g.fillText(p.text, 0, 0);
    g.restore();
  }

  function bubble(text, x, y) {
    const g = ctx;
    g.save();
    g.font = 'bold 22px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    const w = g.measureText(text).width + 26;
    const bx = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, x));
    g.fillStyle = '#fffdf2'; g.strokeStyle = '#1b1a22'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(bx - w / 2, y - 30, w, 40, 12); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(x - 6, y + 10); g.lineTo(x + 2, y + 18); g.lineTo(x + 8, y + 10); g.fill(); g.stroke();
    g.fillStyle = '#1b1a22'; g.textAlign = 'center';
    g.fillText(text, bx, y - 2);
    g.restore();
  }

  return { W, H, GROUND, setCtx, getCtx: () => ctx, PAL, villagerPal, background, fighter, tag, ball, wave, ribbon, popup, bubble };
})();

// 战斗核心：角色、动作、球（含反弹/双球）、命中判定、Perfect Dodge、Combo、XP 挂钩。
// 联机时：每个客户端负责自己角色的动作与受击判定（受害者判定），其余角色由网络快照驱动。
const BEAR_R = 520;
const DIFFS = [
  { key: 'EASY',   name: '简单',     think: 1.5,  react: 0.12, perfect: 0,    lv: 1,  cool: 1.4,  conf: 1.3,  combo: 0,   feint: 0,   counter: 0,   sup: 0 },
  { key: 'NORMAL', name: '中等',     think: 1.0,  react: 0.40, perfect: 0.10, lv: 3,  cool: 1.0,  conf: 1.0,  combo: 0.1, feint: 0,   counter: 0.1, sup: 0.2 },
  { key: 'HARD',   name: '困难',     think: 0.7,  react: 0.70, perfect: 0.40, lv: 6,  cool: 0.85, conf: 0.7,  combo: 0.35, feint: 0.1, counter: 0.4, sup: 0.6 },
  { key: 'MASTER', name: '超级困难', think: 0.45, react: 0.95, perfect: 0.85, lv: 10, cool: 0.7,  conf: 0.35, combo: 0.7, feint: 0.3, counter: 0.8, sup: 1 }
];

const G = {
  mode: 'ai', phase: 'menu', F: [], balls: [], waves: [], popups: [], bubbles: [], later: [],
  ribbon: { text: '', t: 0 }, shake: { x: 0, y: 0, mag: 0 }, flash: 0, me: null, time: 0, diff: 1, paused: false,
  ts: 1, chaos: 0, speedT: 0, wobbleT: 0, lvlQ: [], online: null, ballId: 0, funnyCd: 0, M: null, hooks: {}, bus: {}, eventT: 20, result: null
};

const Eng = (() => {
  const { W, H, GROUND } = Draw;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const D = () => DIFFS[G.diff];
  const DUR = { kick: 0.9, bear: 1.3, wobble: 1.8, dodge: 0.45, stumble: 0.6, hit: 0.4, tumble: 1.0, down: 2, win: 4, dance: 3 };
  const FAIL_TEXT = ['闪身失败！', '哎呀！', '这次没闪过去！'];
  const FAIL_NAMES = ['踉跄', '打滑', '反向晃', '快速抖', '差点闪过'];
  const HITLINES = ['哎哟！', '等等！', '我只是跳个舞啊！', '怎么又是我……', '你干嘛？'];

  const E = {};
  E.emit = (name, a, b) => { const f = G.bus[name]; if (f) f(a, b); };
  E.rnd = rnd; E.pick = pick; E.clamp = clamp;

  // ---------- 角色 ----------
  E.mkF = o => ({
    id: o.id, team: o.team, ctl: o.ctl, local: o.ctl !== 'remote', name: o.name || '', pal: o.pal, scale: o.scale || 1,
    x: o.x, home: o.x, facing: o.facing || 1, dir: 0, state: 'idle', st: 0, dur: 1, clock: Math.random() * 3, hp: o.hp || 100, maxhp: o.hp || 100,
    combo: 0, cool: {}, lv: o.lv || { dodge: 1, kick: 1, bear: 1, wobble: 1 },
    confused: 0, invuln: 0, shiver: 0, ghosts: [], ghostT: 0, acted: false, variant: 0, from: o.x, to: o.x,
    perfectChain: 0, dodgeStreak: 0, kickStreak: 0, shakeChain: 0, shakeT: 0, slideV: 0, tx: o.x,
    lastSkill: '', lastSkillT: -9, dummy: !!o.dummy, ai: o.ctl === 'ai' ? { timer: 1.5, react: [], plan: [], seen: '' } : null
  });
  E.byId = id => G.F.find(f => f.id === id);
  E.enemies = f => G.F.filter(t => t.team !== f.team && t.hp > 0 && t.state !== 'down');
  E.nearest = f => {
    let best = null, bd = 1e9;
    for (const t of E.enemies(f)) { const d = Math.abs(t.x - f.x); if (d < bd) { bd = d; best = t; } }
    return best;
  };

  // ---------- 文字 / 字幕 ----------
  E.popup = (text, x, y, color, size, life = 0.9) => G.popups.push({ text, x, y, color, size, life, age: 0, pop: true });
  E.skillName = text => { G.ribbon = { text, t: 1.3 }; };
  E.say = (f, text, quiet) => { G.bubbles.push({ f, text, t: 1.6 }); if (!quiet && f === G.me) Snd.speak(text); };
  E.funny = (text, x = 640, y = 190) => {
    if (G.funnyCd > 0) return;
    G.funnyCd = 2.5;
    E.popup(text, x, y, '#ffe14a', 40, 1.5);
    Snd.speak(text);
  };

  const me = f => f === G.me;
  const canAct = f => f.hp > 0 && f.state === 'idle';
  E.canAct = canAct;
  function setState(f, s, dur) { f.state = s; f.st = 0; f.dur = dur || DUR[s] || 1; f.acted = false; }
  E.setState = setState;
  // 冷却时长（秒）。闪身步左右各自独立 1 秒；AI 的难度只影响非闪身技能
  E.cdFull = (f, key) => {
    const k = key === 'dodgeL' || key === 'dodgeR' ? 'dodge' : key;
    if (k === 'dodge') return SKILLS.dodge.cd;
    return SKILLS[k].cd * Skills.mul(f.lv[k], k).cd * (f.ctl === 'ai' ? D().cool : 1);
  };
  function cdSet(f, key) { f.cool[key] = E.cdFull(f, key); }
  const cdOk = (f, k) => !(f.cool[k] > 0);
  const note = (f, key) => { f.lastSkill = key; f.lastSkillT = G.time; if (f.ctl === 'human') E.emit('skill', f, key); };
  const voice = (f, key) => Snd.playClip(key, me(f) ? 1 : 0.6, me(f));

  // ---------- 动作 ----------
  // 闪身步：每次按下都要掷骰子。成功率由等级决定（70%→90%，永远到不了 100%）。AI 走同一条路径。
  E.dodge = (f, dir) => {
    const ck = dir < 0 ? 'dodgeL' : 'dodgeR';
    if (!canAct(f) || !cdOk(f, ck)) return false;
    const d = dir * (f.confused > 0 ? -1 : 1) * (G.chaos > 0 ? -1 : 1);
    const ok = Math.random() < Skills.rate(f.lv.dodge);
    cdSet(f, ck); note(f, 'dodge');
    f.dir = d; f.from = f.x;
    if (me(f)) { G.M.dodgeUse++; Prog.use('dodge'); Prog.dodgeResult(ok); E.emit('dodgeStart'); }
    if (ok) {
      setState(f, 'dodge');
      f.to = clamp(f.x + d * 120 * (1 + 0.05 * (f.lv.dodge - 1)), 70, W - 70);
      f.dodgeStreak++;
      voice(f, 'dodge');               // 参考视频原声「闪身步」，随动作同步播放
      Snd.sfx('whoosh');
      FX.speedLines(f.x, GROUND - 100, d);
      G.shake.mag = Math.max(G.shake.mag, 4);
      if (f.dodgeStreak >= 2 && (G.mode !== 'village' || me(f))) E.popup('DODGE x' + f.dodgeStreak, f.x, GROUND - 300, '#6cc7ff', 40, 0.9);
      if (me(f)) { Prog.record('dodge'); Prog.best('dodgeStreakBest', f.dodgeStreak); Prog.addSkillXp('dodge', 3, f.combo); }
    } else {
      // 真的失败：不位移躲避、没有无敌，被打到照样掉血
      setState(f, 'stumble');
      f.variant = Math.floor(Math.random() * 5);
      f.dodgeStreak = 0; f.perfectChain = 0;
      Snd.sfx('fail');
      E.popup(pick(FAIL_TEXT), f.x, GROUND - 270, '#ff8a6b', 40, 1.0);
      if (me(f)) { Prog.record('dodgeFail'); G.M.dodgeFail++; E.emit('dodgeFail'); }
    }
    return true;
  };

  E.kick = f => {
    if (!canAct(f) || !cdOk(f, 'kick')) return false;
    setState(f, 'kick'); cdSet(f, 'kick'); note(f, 'kick');
    voice(f, 'kick'); E.skillName('浪子踢球！');
    if (me(f)) { G.M.kicks++; Prog.use('kick'); E.emit('kickStart'); }
    return true;
  };

  E.bear = f => {
    if (!canAct(f) || !cdOk(f, 'bear')) return false;
    setState(f, 'bear'); cdSet(f, 'bear'); note(f, 'bear');
    voice(f, 'bear'); E.skillName('狗熊哆嗦毛！');
    if (me(f)) { Prog.use('bear'); Prog.record('bear'); Prog.addSkillXp('bear', 4, f.combo); }
    return true;
  };

  E.wobble = f => {
    if (!canAct(f) || !cdOk(f, 'wobble')) return false;
    setState(f, 'wobble'); cdSet(f, 'wobble'); note(f, 'wobble');
    voice(f, 'wobble'); Snd.sfx('wobble'); E.skillName('摇头晃脑！');
    const dur = (2.2 + 0.25 * (f.lv.wobble - 1)) * (f.ctl === 'ai' ? D().conf : 1);
    E.netEmit({ k: 'wob', team: f.team, from: f.id, dur });
    if (me(f)) { Prog.use('wobble'); Prog.record('wobble'); Prog.addSkillXp('wobble', 6, f.combo); }
    return true;
  };

  E.perform = (f, key, dir) => {
    switch (key) {
      case 'dodgeL': return E.dodge(f, -1);
      case 'dodgeR': return E.dodge(f, 1);
      case 'dodge': return E.dodge(f, dir || (f.facing > 0 ? -1 : 1));
      case 'kick': return E.kick(f);
      case 'bear': return E.bear(f);
      case 'wobble': return E.wobble(f);
    }
    return false;
  };

  // ---------- 网络事件 / 本地结算 ----------
  E.netEmit = ev => {                       // 本地产生的攻击事件：本地结算 + 联机广播
    E.resolveEv(ev);
    if (G.online && typeof MP !== 'undefined') MP.sendEv(ev);
  };
  E.resolveEv = ev => {
    switch (ev.k) {
      case 'ball': if (!G.balls.find(b => b.id === ev.b.id)) G.balls.push(ev.b); break;
      case 'bdel': G.balls = G.balls.filter(b => b.id !== ev.id); break;
      case 'aoe': {
        for (const t of G.F) {
          if (!t.local || t.hp <= 0 || t.team === ev.team) continue;
          const dx = t.x - ev.x;
          if (Math.abs(dx) > ev.r) continue;
          if (ev.front && dx * ev.front < -30) continue;
          hurt(t, { dmg: ev.dmg, kind: ev.kind, from: ev.from, dir: dx >= 0 ? 1 : -1, kb: ev.kb, sup: false });
        }
        break;
      }
      case 'wob': {
        for (const t of G.F) {
          if (!t.local || t.hp <= 0 || t.team === ev.team) continue;
          t.confused = ev.dur;
          if (G.mode !== 'village' || me(t)) E.popup('CONFUSED!', t.x, GROUND - 270, '#8fe08a', 44, 1.1);
          if (me(t)) { G.wobbleT = Math.min(ev.dur, 1.6); E.popup('？？？', 640, 260, '#fff', 48, 1); }
        }
        break;
      }
      case 'fx': FX.ring(ev.x, GROUND, ev.r, '#fff3a0'); break;
    }
  };

  // ---------- 球 ----------
  E.spawnBall = (f, o = {}) => {
    const m = Skills.mul(f.lv.kick, 'kick').dmg;
    const b = {
      id: f.id + '-' + (++G.ballId), team: f.team, from: f.id,
      x: f.x + f.facing * 95, y: GROUND - 78, vx: f.facing * 820 * (o.vx || 1), vy: o.vy || -260,
      r: 17, dmg: Math.round(10 * m), big: false, wall: 0, free: false, rot: 0, age: 0, skip: {}
    };
    Snd.sfx('kick'); Snd.sfx('whoosh');
    E.netEmit({ k: 'ball', b });
    return b;
  };
  // 场地随机球（中立：谁都能打到）
  E.neutralBall = (side, giant) => {
    const dir = side > 0 ? -1 : 1;
    const b = {
      id: 'n-' + (++G.ballId) + '-' + Math.floor(Math.random() * 999), team: -1, from: -1,
      x: side > 0 ? W - 40 : 40, y: GROUND - rnd(90, 160), vx: dir * (giant ? 380 : rnd(520, 700)), vy: giant ? -100 : -200,
      r: giant ? 46 : 20, dmg: giant ? 14 : 8, big: giant, wall: 0, free: true, rot: 0, age: 0, skip: {}
    };
    G.balls.push(b);
  };

  function wallBounce(b) {
    b.wall++; b.free = true;
    Snd.sfx('bounce');
    FX.burst(b.x, b.y, 4, '#fff', 'spark', 200);
    if (b.from >= 0 && G.me && b.from === G.me.id && b.wall >= 2) {
      E.popup('BOUNCE x' + b.wall, b.x, b.y - 50, '#6cf0ff', 36, 0.9);
      Prog.addSkillXp('kick', 3 * b.wall, G.me.combo);
      Prog.best('bounceBest', b.wall);
    }
  }

  E.updateBalls = dt => {
    for (const b of G.balls) {
      b.age += dt; b.vy += 1100 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vx * dt * 0.05 / (b.r / 17);
      if (b.y > GROUND - b.r) {
        b.y = GROUND - b.r;
        if (Math.abs(b.vy) > 420 && b.from >= 0 && G.me && b.from === G.me.id) { b.wall++; }
        if (Math.abs(b.vy) > 150) { Snd.sfx('bounce'); FX.dust(b.x, 2); }
        b.vy = -b.vy * 0.72; b.vx *= 0.93;
        if (Math.abs(b.vy) < 120) b.vy = 0;
      }
      if (b.x < b.r + 20) { b.x = b.r + 20; b.vx = Math.abs(b.vx) * 0.9; wallBounce(b); }
      if (b.x > W - b.r - 20) { b.x = W - b.r - 20; b.vx = -Math.abs(b.vx) * 0.9; wallBounce(b); }
      if (b.age > 7 || (Math.abs(b.vx) < 60 && b.y >= GROUND - b.r - 1 && b.age > 0.6)) b.dead = true;
    }
    // 球与球碰撞（双球混乱）
    for (let i = 0; i < G.balls.length; i++) for (let j = i + 1; j < G.balls.length; j++) {
      const a = G.balls[i], c = G.balls[j];
      if (a.dead || c.dead) continue;
      const dx = c.x - a.x, dy = c.y - a.y;
      if (dx * dx + dy * dy < (a.r + c.r) * (a.r + c.r)) {
        const tx = a.vx, ty = a.vy; a.vx = c.vx; a.vy = c.vy; c.vx = tx; c.vy = ty;
        a.x -= Math.sign(dx || 1) * 6; c.x += Math.sign(dx || 1) * 6; a.free = c.free = true;
        FX.burst((a.x + c.x) / 2, (a.y + c.y) / 2, 5, '#ffe14a', 'star', 240); Snd.sfx('bounce');
      }
    }
    // 球与角色（受害者本地判定）
    for (const b of G.balls) {
      if (b.dead) continue;
      for (const t of G.F) {
        if (!t.local || t.hp <= 0 || t.state === 'down') continue;
        if (!(b.team !== t.team || b.free) || b.team === t.team && b.team >= 0 && !b.free) continue;
        if (t.id === b.from && b.wall === 0) continue;
        if (b.skip[t.id]) continue;
        const hx = t.state === 'dodge' ? t.from : t.x;      // 闪身中：球打在残影（起点）上
        if (Math.abs(b.x - hx) < 40 + b.r && b.y > GROUND - 215 && b.y < GROUND + 10) {
          const dir = b.vx >= 0 ? 1 : -1;
          const r = hurt(t, { dmg: Math.max(3, Math.round(b.dmg * (b.wall >= 2 ? 0.7 : 1))), kind: 'ball', from: b.from, dir, kb: b.big ? 90 : 45 });
          if (r === 'hit' || r === 'perfect' && false) { b.dead = true; if (G.online && typeof MP !== 'undefined') MP.sendEv({ k: 'bdel', id: b.id }); }
          else b.skip[t.id] = true;
        }
      }
    }
    G.balls = G.balls.filter(b => !b.dead);
  };

  // ---------- 命中 / 躲避 / 得分 ----------
  function hurt(t, a) {
    if (t.hp <= 0 || t.invuln > 0 || G.phase === 'ko' || G.phase === 'over') return 'none';
    const src = E.byId(a.from);
    if (t.state === 'dodge') {
      // 闪身判定已成功，并且这次攻击本来真的会打中 → 真正躲开 = PERFECT DODGE!
      E.popup('PERFECT DODGE!', t.x, GROUND - 260, '#ffe14a', 50, 1.1);
      Snd.sfx('perfect'); FX.burst(t.x, GROUND - 120, 8, '#ffe14a', 'star', 340);
      t.perfectChain++; t.combo++;
      if (me(t)) {
        Prog.record('perfect'); Prog.best('perfectBest', t.perfectChain);
        G.M.dodgeOk++; G.M.perfect++;
        Prog.addSkillXp('dodge', 25 + 5 * (t.perfectChain - 1), t.combo);
        checkCombo(t); E.emit('perfect');
        if (t.perfectChain >= 3) E.funny('这不科学。', 640, 200);
      }
      if (G.hooks.perfect) G.hooks.perfect(t, src);
      return 'perfect';
    }
    const dmg = a.dmg;
    t.hp = Math.max(0, t.hp - dmg);
    if (t.dummy) t.hp = t.maxhp;
    t.perfectChain = 0;
    if (src === G.me) { G.M.damage += dmg; Prog.record('damage', dmg); }
    t.x = clamp(t.x + a.dir * a.kb, 70, W - 70);
    t.shiver = a.kind === 'bear' ? 0.6 : 0.3;
    const heavy = a.big || a.kind === 'bear' || dmg >= 14;
    if (t.hp > 0) {
      if (heavy) { setState(t, 'tumble'); t.variant = Math.floor(Math.random() * 6); t.slideV = a.dir * (t.variant === 4 ? 380 : 120); }
      else setState(t, 'hit');
    }
    if (t === G.me) { t.combo = 0; t.kickStreak = 0; E.emit('hurt'); Snd.setIntensity(0); if (a.kind === 'ball') E.funny('球：找到你了。', t.x, GROUND - 280); }
    if (src && src !== t) {
      src.combo++;
      if (src === G.me) checkCombo(src);
    }
    if (t.ctl === 'ai' && t.hp > 0 && src === G.me) { t.hitStreak = (t.hitStreak || 0) + 1; if (t.hitStreak >= 3) { E.funny('你礼貌吗？', 640, 190); t.hitStreak = 0; } }
    switch (a.kind) {
      case 'ball':
        E.popup(a.big ? '巨大球！' : '砰！', t.x, GROUND - 250, '#ff9a6b', a.big ? 60 : 46, 0.8);
        if (src === G.me) {
          Prog.record('kickHit'); G.M.kickHit++; src.kickStreak++; Prog.best('kickStreakBest', src.kickStreak);
          Prog.addSkillXp('kick', 8, src.combo); E.emit('kickHit');
        }
        break;
      case 'bear':
        E.popup('BOOM！', t.x, GROUND - 250, '#ff7a59', 52, 0.9);
        if (src) { src.shakeChain = (G.time - src.shakeT < 6 ? src.shakeChain : 0) + 1; src.shakeT = G.time; if (src.shakeChain >= 2) E.popup('SHAKE COMBO!', t.x, GROUND - 310, '#ffb08a', 50, 1.1); }
        if (src === G.me) Prog.addSkillXp('bear', 10, src.combo);
        break;
      default: E.popup('砰！', t.x, GROUND - 250, '#ff9a6b', 44, 0.7);
    }
    Snd.sfx('hit'); Snd.sfx(a.kind === 'bear' ? 'boom' : 'step');
    G.shake.mag = Math.max(G.shake.mag, a.kind === 'bear' ? 24 : 10);
    FX.burst(t.x, GROUND - 130, 7, '#ffd34d', 'star', 360);
    if (Math.random() < 0.55 || t.hp < 25) E.say(t, t.hp < 25 ? '救命！' : pick(HITLINES), t !== G.me);
    if (t.hp <= 0) E.ko(t);
    return 'hit';
  }
  E.hurt = hurt;

  function checkCombo(f) {
    const c = f.combo;
    if (c > G.M.maxCombo) { G.M.maxCombo = c; Prog.best('maxCombo', c); }
    Snd.setIntensity(c);
    if ([2, 3, 5, 10, 20].includes(c)) {
      E.popup(c + ' COMBO!', 640, 150, '#ffe14a', 54, 1.2); Snd.sfx('combo');
      if (c === 10) E.funny('你是不是练过？', 640, 215);
      if (c === 20) E.funny('闪身步大师！', 640, 215);
    }
  }

  // ---------- 逐帧更新 ----------
  E.updateFighter = (f, dt) => {
    f.clock += dt; f.st += dt;
    for (const k in f.cool) if (f.cool[k] > 0) f.cool[k] -= dt;
    if (f.confused > 0) f.confused -= dt;
    if (f.invuln > 0) f.invuln -= dt;
    if (f.shiver > 0) f.shiver -= dt;
    for (const g of f.ghosts) g.life -= dt;
    f.ghosts = f.ghosts.filter(g => g.life > 0);
    if (f.ctl === 'remote') {                    // 远程角色：平滑逼近网络位置
      f.x += (f.tx - f.x) * Math.min(1, dt * 16);
      if (f.state === 'dodge') { f.ghostT -= dt; if (f.ghostT <= 0) { f.ghostT = 0.06; f.ghosts.push({ ...f, ghosts: null, life: 0.28 }); } }
      const t = E.nearest(f); if (t && f.state !== 'down' && f.state !== 'win') f.facing = t.x >= f.x ? 1 : -1;
      return;
    }
    const t = E.nearest(f);
    if (t && !['down', 'win', 'tumble', 'dodge', 'stumble'].includes(f.state)) f.facing = t.x >= f.x ? 1 : -1;

    switch (f.state) {
      case 'dodge': {
        const k = clamp(f.st / f.dur, 0, 1), e = 1 - Math.pow(1 - k, 3);
        f.x = f.from + (f.to - f.from) * e;
        f.ghostT -= dt;
        if (f.ghostT <= 0) { f.ghostT = 0.06; f.ghosts.push({ ...f, ghosts: null, life: 0.28 }); }
        if (f.st >= f.dur) setState(f, 'idle');
        break;
      }
      case 'stumble': {
        const k = clamp(f.st / f.dur, 0, 1), s1 = Math.sin(Math.PI * k);
        const v = f.variant;                               // 0 踉跄 1 打滑 2 反向晃 3 快速抖 4 差点闪过
        const off = v === 1 ? f.dir * 70 * (1 - Math.pow(1 - k, 2)) : v === 2 ? -f.dir * 42 * s1 : v === 4 ? f.dir * 55 * s1 : 0;
        f.x = clamp(f.from + off, 70, W - 70);
        if (f.st >= f.dur) setState(f, 'idle');
        break;
      }
      case 'kick':
        if (f.st >= 0.5 && !f.acted) {
          f.acted = true;
          E.spawnBall(f, {});
          if (G.mode === 'double') G.later.push({ t: 0.22, fn: () => { if (f.hp > 0) E.spawnBall(f, { vy: -430, vx: 0.9 }); } });
          FX.burst(f.x + f.facing * 95, GROUND - 78, 5, '#ffd34d', 'star', 220);
        }
        if (f.st >= f.dur) setState(f, 'idle');
        break;
      case 'bear':
        if (f.st >= 0.9 && !f.acted) {
          f.acted = true;
          const R = BEAR_R + 10 * (f.lv.bear - 1);
          G.waves.push({ x: f.x, t: 0, life: 0.7, maxR: R + 60 });
          FX.ring(f.x, GROUND, 360, '#fff3a0', 0.6);
          E.popup('SHAKE!', f.x, GROUND - 290, '#ffb08a', 50, 1.0);
          Snd.sfx('bear'); Snd.sfx('boom'); G.shake.mag = Math.max(G.shake.mag, 26);
          E.netEmit({ k: 'aoe', kind: 'bear', team: f.team, from: f.id, x: f.x, r: R, dmg: Math.round(15 * Skills.mul(f.lv.bear, 'bear').dmg), kb: 80 });
        }
        if (f.st >= f.dur) setState(f, 'idle');
        break;
      case 'wobble': case 'hit': case 'dance': if (f.st >= f.dur) setState(f, 'idle'); break;
      case 'tumble':
        f.x = clamp(f.x + f.slideV * dt, 70, W - 70); f.slideV *= Math.pow(0.03, dt);
        if (f.st >= f.dur) setState(f, 'idle');
        break;
      case 'down': f.x = clamp(f.x + f.slideV * dt, 70, W - 70); f.slideV *= Math.pow(0.03, dt); break;
    }
    // 不能自由走动：空闲时慢慢回到自己的站位（被击退 / 闪身之后归位）
    if (f.state === 'idle' && f.home != null) {
      const dx = f.home - f.x;
      if (Math.abs(dx) > 3) f.x += Math.sign(dx) * Math.min(Math.abs(dx), 170 * dt);
    }
  };

  // ---------- 倒地 / 结束 ----------
  E.ko = loser => {
    if (loser.state === 'down') return;
    setState(loser, 'down'); loser.variant = Math.floor(Math.random() * 6); loser.slideV = loser.variant === 4 ? 340 * -loser.facing : 0;
    loser.hp = 0;
    E.emit('ko', loser);
  };

  // ---------- 联机快照 ----------
  E.snapOf = f => ({ x: Math.round(f.x), s: f.state, st: +f.st.toFixed(2), d: f.dur, dr: f.dir, fc: f.facing, hp: f.hp, v: f.variant, cb: f.combo,
    lv: [f.lv.dodge, f.lv.kick, f.lv.bear, f.lv.wobble], cf: f.confused > 0 ? 1 : 0, sh: f.shiver > 0 ? 1 : 0 });
  E.applySnap = (f, s) => {
    if (!f || f.ctl !== 'remote') return;
    f.tx = s.x;
    if (f.state !== s.s) { f.state = s.s; f.st = s.st; f.acted = false; if (s.s === 'dodge' || s.s === 'stumble') f.from = f.x; }
    else if (Math.abs(f.st - s.st) > 0.15) f.st = s.st;
    f.dur = s.d; f.dir = s.dr; f.facing = s.fc; f.hp = s.hp; f.variant = s.v; f.combo = s.cb; f.confused = s.cf ? 0.5 : 0; f.shiver = s.sh ? 0.3 : 0;
    if (s.lv) { ['dodge', 'kick', 'bear', 'wobble'].forEach((n, i) => { f.lv[n] = s.lv[i]; }); }
    if (s.s === 'down' && f.hp <= 0) f.hp = 0;
  };

  // ---------- 随机事件 ----------
  E.randomEvent = type => {
    const types = ['giant', 'double', 'speed', 'chaos', 'dance'];
    type = type || pick(types);
    switch (type) {
      case 'giant': E.popup('⚽ 巨大球！', 640, 220, '#ffe14a', 56, 1.4); E.neutralBall(Math.random() < 0.5 ? 1 : -1, true); break;
      case 'double': E.popup('DOUBLE BALL!', 640, 220, '#ffe14a', 64, 1.4); E.neutralBall(1); E.neutralBall(-1); break;
      case 'speed': E.popup('💨 极速模式！', 640, 220, '#6cc7ff', 56, 1.4); G.speedT = 6; break;
      case 'chaos': E.popup('🌀 混乱模式！左右颠倒', 640, 220, '#8fe08a', 48, 1.6); G.chaos = 5; break;
      case 'dance':
        E.popup('🕺 全员跳舞！', 640, 220, '#ff9ee0', 56, 1.4);
        E.popup('村里的舞会开始了！', 640, 290, '#fff', 40, 2.4);
        G.F.forEach(f => { if (f.hp > 0 && f.state !== 'down') { setState(f, 'dance'); f.invuln = 3; } });
        break;
    }
  };

  return E;
})();

// AI：按玩家距离 / 双方 HP / 冷却 / 玩家最近动作加权随机选择动作。
// 难度 EASY / NORMAL / HARD / MASTER：MASTER 会 Perfect Dodge、连续攻击、假动作、反击和随机动作组合。
const AI = (() => {
  const { W, GROUND } = Draw;
  const rnd = Eng.rnd, pick = Eng.pick;
  const D = () => DIFFS[G.diff];
  const COMBOS = [['wobble', 'kick', 'kick'], ['kick', 'dodge', 'kick'], ['bear', 'kick'], ['wobble', 'bear'], ['kick', 'kick']];

  function awayDir(f, t) {
    const d = f.x >= (t ? t.x : W / 2) ? 1 : -1;
    return (f.x + d * 120 < W - 70 && f.x + d * 120 > 70) ? d : -d;
  }
  // 球到达角色还要多久（秒）
  function timeToHit(b, f) {
    if (Math.abs(b.vx) < 50) return Infinity;
    const dx = f.x - b.x;
    if (dx * b.vx <= 0) return Infinity;
    return Math.max(0, (Math.abs(dx) - 40 - b.r) / Math.abs(b.vx));
  }
  const cd = (f, k) => !(f.cool[k] > 0);
  // AI 只有 5 个动作：左闪 / 右闪 / 踢球 / 狗熊 / 摇头。闪身同样要掷骰子（Eng.dodge 内部判定，和玩家完全一样）
  const act = (f, key, t) => {
    switch (key) {
      case 'dodge': return Eng.dodge(f, awayDir(f, t));
      case 'dodgeL': return Eng.dodge(f, -1);
      case 'dodgeR': return Eng.dodge(f, 1);
      case 'kick': return Eng.kick(f);
      case 'bear': return Eng.bear(f);
      case 'wobble': return Eng.wobble(f);
    }
    return false;
  };
  const dodgeReady = f => cd(f, 'dodgeL') || cd(f, 'dodgeR');

  // 被 PERFECT 闪开后，高难度 AI 会立刻反击
  G.hooks.perfect = (t, src) => {
    if (t.ctl !== 'ai' || !D().counter || Math.random() > D().counter) return;
    G.later.push({ t: 0.12, fn: () => {
      if (t.hp <= 0 || !Eng.canAct(t)) return;
      const e = Eng.nearest(t);
      if (e && Math.abs(e.x - t.x) < 240) { if (!Eng.bear(t)) Eng.kick(t); } else Eng.kick(t);
    } });
  };

  function decide(f) {
    const ai = f.ai, t = Eng.nearest(f);
    if (!t) return;
    const D_ = D();
    const d = Math.abs(t.x - f.x);
    ai.timer = (0.55 + Math.random() * 0.5) * D_.think * (f.village ? 1.3 : 1);

    if (ai.plan.length) {                        // 动作组合（连续攻击）
      const next = ai.plan.shift();
      if (!act(f, next, t)) ai.plan = [];
      else ai.timer = 0.25 * D_.think + 0.2;
      return;
    }
    if (Math.random() < D_.feint && dodgeReady(f)) {   // 假动作：先晃一下再出招
      act(f, 'dodge', t);
      ai.plan = [Math.random() < 0.5 ? 'bear' : 'kick'];
      ai.timer = 0.5;
      return;
    }
    if (Math.random() < D_.combo) {
      ai.plan = pick(COMBOS).slice();
      const first = ai.plan.shift();
      if (act(f, first, t)) { ai.timer = 0.3; return; }
      ai.plan = [];
    }
    // 按距离 / HP / 冷却 / 玩家最近动作 / 球位置加权选择
    const w = {};
    const lowSelf = f.hp / f.maxhp < 0.35;
    let ballNear = false;
    for (const b of G.balls) if (timeToHit(b, f) < 0.8 && !((b.team === f.team) && !b.free)) ballNear = true;
    if (cd(f, 'kick')) w.kick = d > 400 ? 3.2 : 2;
    if (cd(f, 'bear') && d < 560) w.bear = 2.6 + (t.lastSkill === 'dodge' && G.time - t.lastSkillT < 1 ? 2.5 : 0);   // 玩家一直闪 → 范围技能
    if (cd(f, 'wobble') && !(t.confused > 0)) w.wobble = 1.6;
    if (dodgeReady(f)) w.dodge = 0.5 + (t.state === 'kick' && t.st < 0.5 ? 3 : 0) + (t.state === 'bear' ? 2 : 0) + (lowSelf ? 1.2 : 0) + (ballNear ? 3 : 0)
      + (t.lastSkill === 'kick' && G.time - t.lastSkillT < 0.6 ? 2 : 0);
    w.idle = 0.7;
    let sum = 0; for (const k in w) sum += w[k];
    let r = Math.random() * sum, key = 'idle';
    for (const k in w) { r -= w[k]; if (r <= 0) { key = k; break; } }
    if (key !== 'idle') act(f, key, t);
  }

  function update(f, dt) {
    const ai = f.ai;
    if (!ai || f.hp <= 0 || f.state === 'down') return;
    // 看球：决定何时闪（MASTER 瞄准 PERFECT 窗口）
    if (Eng.canAct(f)) {
      for (const b of G.balls) {
        if (b.skip[f.id] || (b.team === f.team && !b.free) || (b.from === f.id && b.wall === 0)) continue;
        b.seen = b.seen || {};
        if (b.seen[f.id]) continue;
        const tt = timeToHit(b, f);
        if (tt < 0.9) {
          b.seen[f.id] = true;
          const D_ = D();
          if (Math.random() < D_.react) {
            const perfect = Math.random() < D_.perfect;
            const delay = Math.max(0, perfect ? tt - rnd(0.15, 0.2) : tt - rnd(0.35, 0.7));
            ai.react.push({ t: delay, kind: 'dodge' });
          }
        }
      }
    }
    // 看对手蓄力狗熊哆嗦毛
    const e = Eng.nearest(f);
    if (e && e.state !== ai.seen) {
      ai.seen = e.state;
      if (e.state === 'bear' && f.confused <= 0 && Math.abs(e.x - f.x) < 320 && Math.random() < D().react * 0.8) ai.react.push({ t: 0.5, kind: 'dodge' });
    }
    for (const r of ai.react) r.t -= dt;
    const due = ai.react.filter(r => r.t <= 0);
    ai.react = ai.react.filter(r => r.t > 0);
    if (due.length && Eng.canAct(f)) act(f, 'dodge', e);

    ai.timer -= dt;
    if (ai.timer <= 0 && f.state === 'idle') decide(f);
  }

  return { update };
})();

// 游戏主循环：模式搭建、开场倒计时、阶段切换、键盘输入、HUD、教学、结算。
const Game = (() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  Draw.setCtx(ctx);
  const { W, H, GROUND } = Draw;
  const clamp = Eng.clamp;
  let cfg = { mode: 'ai', diff: 1 };
  let introT = 0, introIdx = 0, koT = 0, netAccum = 0, tut = null, running = false, last = 0, endSent = false;
  let demo = null, demoT = 0, demoIdx = 0;
  const API = { onEnd: null, onPhase: null, get cfg() { return cfg; } };

  // ---------- 搭建对局 ----------
  function levelsFromSave() { const o = {}; SKILL_KEYS.forEach(k => { o[k] = Store.data.skills[k].lv; }); return o; }
  function levelsAll(n) { const o = {}; SKILL_KEYS.forEach(k => { o[k] = n; }); return o; }

  function build() {
    const diff = clamp(cfg.diff, 0, 3), aiLv = levelsAll(DIFFS[diff].lv);
    const F = [];
    const mk = (o) => { const f = Eng.mkF(o); F.push(f); return f; };
    G.p2 = null;
    switch (cfg.mode) {
      case 'local2p':
        G.me = mk({ id: 0, team: 0, ctl: 'human', pal: Draw.PAL.p, x: -120, lv: levelsFromSave(), name: 'P1' }); G.me.home = 330;
        G.p2 = mk({ id: 1, team: 1, ctl: 'human', pal: Draw.PAL.a, x: W + 120, facing: -1, lv: levelsFromSave(), name: 'P2' }); G.p2.home = 950;
        break;
      case 'village': {
        G.me = mk({ id: 0, team: 0, ctl: 'human', pal: Draw.PAL.p, x: -120, lv: levelsFromSave(), name: 'PLAYER' }); G.me.home = 200;
        const homes = [480, 700, 880, 1040, 1160];
        homes.forEach((hx, i) => {
          const f = mk({ id: i + 1, team: i + 1, ctl: 'ai', pal: Draw.villagerPal(i), x: W + 100 + i * 70, facing: -1, hp: 55, scale: 0.92, lv: levelsAll(Math.max(1, DIFFS[diff].lv - 1)) });
          f.home = hx; f.village = true; f.name = '村民' + (i + 1);
        });
        break;
      }
      case 'online': {
        const o = cfg.online;
        o.players.forEach(p => {
          const mine = p.slot === o.slot;
          const f = mk({ id: p.slot, team: p.team, ctl: mine ? 'human' : 'remote', pal: o.mode === '2v2' ? (p.team === 0 ? Draw.villagerPal(p.slot === 0 ? 3 : 1) : Draw.villagerPal(p.slot === 2 ? 0 : 5)) : (p.team === 0 ? Draw.PAL.p : Draw.PAL.a),
            x: p.team === 0 ? -120 - p.slot * 60 : W + 120 + p.slot * 60, facing: p.team === 0 ? 1 : -1, lv: levelsFromSave(), name: p.name });
          const homes2 = { 0: 220, 1: 380, 2: 900, 3: 1060 };
          f.home = o.mode === '2v2' ? homes2[p.slot] : (p.team === 0 ? 330 : 950);
          if (mine) G.me = f;
        });
        break;
      }
      default: {  // ai / double / tutorial
        G.me = mk({ id: 0, team: 0, ctl: 'human', pal: Draw.PAL.p, x: -120, lv: levelsFromSave(), name: 'PLAYER' }); G.me.home = 330;
        const a = mk({ id: 1, team: 1, ctl: cfg.mode === 'tutorial' ? 'dummy' : 'ai', pal: Draw.PAL.a, x: W + 120, facing: -1, lv: aiLv, dummy: cfg.mode === 'tutorial', name: 'AI' });
        a.home = 980;
      }
    }
    G.F = F;
  }

  API.start = c => {
    cfg = Object.assign({ mode: 'ai', diff: Store.data.settings.diff }, c);
    G.mode = cfg.mode; G.diff = clamp(cfg.diff, 0, 3); G.online = cfg.mode === 'online' ? cfg.online : null;
    G.balls = []; G.waves = []; G.popups = []; G.bubbles = []; G.later = []; G.lvlQ = [];
    G.ribbon = { text: '', t: 0 }; G.shake = { x: 0, y: 0, mag: 0 }; G.flash = 0; G.time = 0; G.paused = false; G.netWait = false;
    G.ts = 1; G.chaos = 0; G.speedT = 0; G.wobbleT = 0; G.funnyCd = 0; G.ballId = 0; G.result = null;
    G.eventT = 14 + Math.random() * 8;
    G.M = { damage: 0, dodgeUse: 0, dodgeOk: 0, dodgeFail: 0, perfect: 0, kicks: 0, kickHit: 0, maxCombo: 0 };
    Prog.resetMatch(); FX.clear();
    build();
    introT = 0; introIdx = 0; koT = 0; netAccum = 0; endSent = false;
    tut = cfg.mode === 'tutorial' ? { step: 0, t: 0, done: 0, ballT: 2 } : null;
    G.phase = 'intro';
    Snd.init(); Snd.startMusic(); Snd.setIntensity(0);
    if (API.onPhase) API.onPhase('intro');
    if (tut) UI.tutorial(0);
  };
  API.restart = () => API.start(cfg);
  API.quit = () => {
    G.phase = 'menu'; G.paused = false; Snd.stopMusic(); FX.clear();
    if (G.online && typeof MP !== 'undefined') MP.leaveGame();
    G.online = null;
    G.F = []; G.balls = []; G.me = null; initDemo();
    if (API.onPhase) API.onPhase('menu');
  };
  API.pause = () => { if (G.phase === 'fight' || G.phase === 'intro') { G.paused = true; if (API.onPhase) API.onPhase('pause'); } };
  API.resume = () => { G.paused = false; if (API.onPhase) API.onPhase(G.phase); };

  // ---------- 输入 ----------
  const fOf = p => (p === 0 ? G.me : G.p2);
  API.press = (p, key) => {
    const f = fOf(p);
    if (!f || G.phase !== 'fight' || G.paused || G.netWait) return false;
    Snd.init();
    return Eng.perform(f, key);
  };

  // 电脑键位：A ← 闪身，D 闪身 →，J 浪子踢球，K 狗熊哆嗦毛，L 摇头晃脑，ESC 暂停（本地双人：P2 用 ←/→ 闪身，1/2/3 技能）
  const K1 = { a: 'dodgeL', d: 'dodgeR', j: 'kick', k: 'bear', l: 'wobble' };
  const K2 = { arrowleft: 'dodgeL', arrowright: 'dodgeR', '1': 'kick', '2': 'bear', '3': 'wobble' };
  window.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'Escape') { if (G.phase === 'fight' || G.phase === 'intro') { G.paused ? API.resume() : API.pause(); } return; }
    if (G.phase !== 'fight' && G.phase !== 'intro') return;
    const k = e.key.toLowerCase();
    let used = false;
    if (K1[k]) { if (!e.repeat) API.press(0, K1[k]); used = true; }
    else if (cfg.mode === 'local2p' && K2[k]) { if (!e.repeat) API.press(1, K2[k]); used = true; }
    if (used || k === 'arrowleft' || k === 'arrowright') e.preventDefault();
  });

  // ---------- 联机回调 ----------
  API.netEv = (slot, ev) => { Eng.resolveEv(ev); };
  API.netSnap = (slot, s) => { Eng.applySnap(Eng.byId(slot), s); };
  API.netOver = winTeam => { if (G.phase === 'fight') finish(winTeam); };
  API.netPeer = status => { G.netWait = status === 'disconnected'; };
  G.bus.ko = loser => { if (G.online && loser.local && typeof MP !== 'undefined') MP.sendKo(); };

  // ---------- 阶段 ----------
  function alive(team) { return G.F.some(f => f.team === team && f.hp > 0); }
  function checkEnd() {
    if (G.online || tut) return;
    const teams = [...new Set(G.F.map(f => f.team))].filter(alive);
    if (G.mode === 'village') {
      if (G.me.hp <= 0) finish(-2); else if (teams.length <= 1) finish(G.me.team);
    } else if (teams.length <= 1) finish(teams[0]);
  }

  function finish(winTeam) {
    if (G.phase === 'ko' || G.phase === 'over') return;
    G.phase = 'ko'; koT = 0; G.winTeam = winTeam;
    G.balls = []; G.later = []; G.waves = [];            // 比赛结束：所有攻击立刻停止
    for (const f of G.F) {
      if (f.team === winTeam && f.hp > 0 && f.state !== 'down') { Eng.setState(f, 'win'); }
      else if (f.hp > 0) { f.hp = f.hp; }
    }
    const won = winTeam === G.me.team;
    Snd.stopMusic(); Snd.sfx(won ? 'win' : 'lose');
    if (won) FX.confetti(34);
    else Eng.popup('闪身步呢？', 640, 260, '#fff', 56, 1.8);
    if (API.onPhase) API.onPhase('ko');
  }

  function buildResult() {
    const won = G.winTeam === G.me.team;
    // 存档统计
    if (!tut) {
      Prog.record('matches'); Prog.record(won ? 'wins' : 'losses');
      if (won) {
        if (G.mode === 'double') Prog.record('dbWins');
        if (['local2p', 'village', 'online'].includes(G.mode)) Prog.record('mpWins');
        if (G.diff === 3 && ['ai', 'double', 'village'].includes(G.mode)) Prog.record('masterWins');
      }
      Prog.addPlayerXp(won ? 60 : 20); Prog.match.xp += won ? 60 : 20;
      Store.save();
    }
    let title = won ? 'YOU WIN!' : 'YOU LOST!', sub = won ? '闪身步之王！' : '你刚才为什么不闪？';
