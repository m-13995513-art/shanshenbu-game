      bar(W - 540, 26, 500, 34, foe.hp, foe.maxhp, '#ff7a59', 'r'); label(foeLabel + '  ' + Math.ceil(foe.hp), W - 40, 18, 'r');
    }
    ctx.save();
    ctx.font = '900 40px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe14a'; ctx.strokeStyle = '#1b1a22'; ctx.lineWidth = 6;
    ctx.strokeText('VS', W / 2, 52); ctx.fillText('VS', W / 2, 52);
    if (me.combo >= 2) {

    if (full) { ctx.globalAlpha = 0.6 + Math.sin(performance.now() / 150) * 0.4; }
    ctx.restore();
    if (G.chaos > 0) label('🌀 混乱模式 ' + Math.ceil(G.chaos), W / 2 + 170, 100, 'l', 20);
    if (G.speedT > 0) label('💨 极速 ' + Math.ceil(G.speedT), W / 2 - 170, 100, 'r', 20);
  }
  function drawLevelUp() {
    const q = G.lvlQ[0]; if (!q) return;
    const a = q.t < 0.2 ? q.t / 0.2 : q.t > 2.0 ? Math.max(0, (2.4 - q.t) / 0.4) : 1;
    const s = q.kind === 'skill' ? SKILLS[q.key] : null;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 250);
    const sc = 1 + Math.max(0, 0.3 - q.t) * 2; ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(15,24,34,.82)'; ctx.strokeStyle = s ? s.color : '#ffe14a'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.roundRect(-260, -70, 520, 150, 22); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe14a';
    ctx.font = '900 54px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(q.kind === 'skill' ? 'LEVEL UP!' : 'PLAYER LEVEL UP!', 0, -12);
    ctx.fillStyle = '#fff'; ctx.font = '900 34px "PingFang SC","Microsoft YaHei",sans-serif';
    const lvTxt = Math.round(q.lv - 1 + Math.min(1, q.t * 2));
    ctx.fillText(q.kind === 'skill' ? s.icon + ' ' + s.name + ' Lv.' + q.lv : 'PLAYER LV.' + q.lv, 0, 40);
    ctx.restore();
  }

  function render() {
    const sway = G.wobbleT > 0 ? Math.sin(G.time * 6) * 4 * Math.min(1, G.wobbleT) : 0;
    G.shake.x = (Math.random() - 0.5) * G.shake.mag + sway; G.shake.y = (Math.random() - 0.5) * G.shake.mag;
    const list = G.phase === 'menu' ? demo || [] : G.F;
    let camx = 640;
    if (list.length) camx = list.reduce((s, f) => s + f.x, 0) / list.length;
    Draw.background(G.shake, camx);
    ctx.save();
    ctx.translate(G.shake.x, G.shake.y);
    for (const f of list) for (const g of f.ghosts || []) Draw.fighter(g, 0.28 * (g.life / 0.28));
    const order = [...list].sort((a, b) => (a === G.me) - (b === G.me));
    order.forEach(f => Draw.fighter(f));
    if (G.phase !== 'menu') {
      if (G.mode === 'village' || (G.mode === 'online')) G.F.forEach(f => Draw.tag(f, G.mode === 'village'));
      for (const b of G.balls) Draw.ball(b);
      for (const w of G.waves) Draw.wave(w);
      for (const b of G.bubbles) Draw.bubble(b.text, b.f.x, GROUND - 300 * (b.f.scale || 1));
    }
    FX.draw(ctx);
    ctx.restore();
    if (G.phase !== 'menu') {
      Draw.ribbon(G.ribbon.t > 0 ? G.ribbon.text : '', Math.min(1, G.ribbon.t * 3));
      for (const p of G.popups) Draw.popup(p);
      if (G.me) drawHud();
      drawLevelUp();
    }
    if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, G.flash)})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- 主循环（只启动一次） ----------
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    render();
    UI.frame(dt);
    requestAnimationFrame(frame);
  }
  API.boot = () => {
    if (running) return; running = true;
    initDemo(); last = performance.now();
    requestAnimationFrame(frame);
  };
  API.inp = inp;
  return API;
})();

// 联机客户端：WebSocket 连接服务器（server/server.js），房间、同步、断线重连。
const MP = (() => {
  let ws = null, url = '', closing = false, tries = 0, rt = null;
  const S = { connected: false, code: '', slot: -1, mode: '1v1', host: 0, players: [], token: '', state: 'lobby', inGame: false };
  const M = { S, on: {} };
  const fire = (n, a, b) => { if (M.on[n]) M.on[n](a, b); };

  M.supported = () => 'WebSocket' in window;
  M.defaultUrl = () => (location.protocol === 'http:' || location.protocol === 'https:') && location.host && !/claude\.ai|claudeusercontent/.test(location.host)
    ? (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host : 'ws://localhost:8787';
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  M.connect = u => new Promise((resolve, reject) => {
    if (!M.supported()) return reject(new Error('当前浏览器不支持实时联机，请使用最新版 Chrome。'));
    url = u; closing = false;
    try { if (ws) { closing = true; ws.close(); } ws = new WebSocket(u); } catch (e) { return reject(new Error('服务器地址无效，或当前页面不允许联机（请用 server/server.js 托管游戏）。')); }
    const to = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('连接超时：无法连接服务器。请确认已运行 server/server.js，并且地址正确。')); }, 6000);
    ws.onopen = () => { clearTimeout(to); closing = false; S.connected = true; tries = 0; resolve(); };
    ws.onerror = () => { clearTimeout(to); reject(new Error('无法连接服务器。请确认已运行 server/server.js，并且地址正确。')); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } handle(m); };
    ws.onclose = () => { S.connected = false; if (!closing && S.code && S.token) reconnect(); else if (!closing) fire('closed'); };
  });

  function reconnect() {                       // 断线重连：最多尝试 10 次
    fire('peer', 'selfDisconnected', S.slot);
    if (rt) return;
    rt = setInterval(() => {
      if (++tries > 10) { clearInterval(rt); rt = null; S.code = ''; fire('closed'); return; }
      M.connect(url).then(() => { clearInterval(rt); rt = null; send({ t: 'rejoin', code: S.code, token: S.token }); }).catch(() => {});
    }, 2000);
  }

  function handle(m) {
    switch (m.t) {
      case 'created': case 'joined':
        S.code = m.code; S.slot = m.slot; S.token = m.token; S.mode = m.mode; fire('joined', m); break;
      case 'room': Object.assign(S, { code: m.code, mode: m.mode, host: m.host, players: m.players, state: m.state }); fire('room', S); break;
      case 'err': fire('error', m.msg, m); break;
      case 'start': S.inGame = true; fire('start', { slot: S.slot, mode: m.mode, players: m.players }); break;
      case 'resume': S.inGame = true; fire('resume', { slot: S.slot, mode: S.mode, players: m.players }); break;
      case 'snap': Game.netSnap(m.slot, m.s); break;
      case 'ev': Game.netEv(m.slot, m.ev); break;
      case 'over': S.inGame = false; Game.netOver(m.winTeam); break;
      case 'peer': Game.netPeer(m.status); fire('peer', m.status, m.slot); break;
    }
  }

  M.create = (mode, name) => send({ t: 'create', mode, name });
  M.join = (code, name) => send({ t: 'join', code, name });
  M.ready = v => send({ t: 'ready', v });
  M.start = () => send({ t: 'start' });
  M.abort = () => send({ t: 'abort' });
  M.sendSnap = s => send({ t: 'snap', s });
  M.sendEv = ev => send({ t: 'ev', ev });
  M.sendKo = () => send({ t: 'ko' });
  M.leaveGame = () => { S.inGame = false; };
  M.leaveRoom = () => { send({ t: 'leave' }); S.code = ''; S.token = ''; S.players = []; closing = true; if (rt) { clearInterval(rt); rt = null; } try { if (ws) ws.close(); } catch (e) {} S.connected = false; };
  return M;
})();

      return `<div class="big" style="font-size:clamp(34px,8vw,80px);color:${r.won ? '#ffe14a' : '#ff8a6b'}">${r.title}</div><div class="big">${r.sub}</div>
      ${r.tutorial ? '' : `<div class="panel" style="width:min(460px,94%)"><h2>本局统计</h2><div class="stat"><span>总伤害</span><span>${M.damage}</span><span>闪身步次数</span><span>${M.dodgeUse}</span><span>成功闪身</span><span>${M.dodgeOk}</span><span>Perfect Dodge</span><span>${M.perfect}</span><span>踢球次数 / 命中</span><span>${M.kicks} / ${M.kickHit}</span><span>最高 Combo</span><span>${M.maxCombo}</span><span>获得 XP</span><span>${r.xp}</span></div>
      ${names.length ? '<h3>🏆 新成就解锁！</h3>' + names.map(b => `<b>${b.icon} ${b.name}</b>`).join('　') : ''}</div>`}
      <div class="chips">${r.tutorial ? '<button class="btn hero" data-go="start">开始对战</button>' : r.mode === 'online' ? '<button class="btn hero" data-go="backlobby">回到房间</button>' : '<button class="btn hero" data-go="restart">再来一局</button>'}<button class="btn" data-go="quit">返回大厅</button></div>`; }
  };

  // ---------- 事件（事件委托） ----------
  const AFTER = {
    skills() { /* 预览在 frame 中绘制 */ },
    online() { online.err = online.err || ''; }
  };
  const readOnline = () => {
    const n = $('olName'), u = $('olUrl'); if (n) online.name = n.value.trim(); if (u) online.url = u.value.trim();
    S().server = online.url; Store.save();
  };
  const err = m => { online.err = m; online.busy = false; const e = $('olErr'); if (e) e.textContent = m; if (cur === 'online') { const bs = scr.querySelectorAll('[data-go=create],[data-go=joinroom]'); bs.forEach(b => { b.disabled = false; }); } };

  function startGame(mode) {
    hide(); $('controls').hidden = false; buildControls(mode);
    Game.start({ mode, diff: S().settings.diff });
  }
  function begin() { S().settings.mode = sel.mode; Store.save(); startGame(sel.mode); }

  function go(a) {
    switch (a) {
      case 'start': if (!S().tutorialDone) { sel.mode = 'tutorial'; startGame('tutorial'); } else startGame(S().settings.mode === 'tutorial' ? 'ai' : S().settings.mode); break;
      case 'mode': sel.mode = S().settings.mode; show('mode'); break;
      case 'begin': begin(); break;
      case 'menu': show('menu'); break;
      case 'online': online.name = online.name || '玩家' + Math.floor(Math.random() * 90 + 10); online.url = online.url || S().server || MP.defaultUrl(); online.err = ''; show('online'); break;
      case 'ach': show('ach'); break; case 'skills': show('skills'); break; case 'help': show('help'); break;
      case 'settings': U.settingsBack = 'menu'; show('settings'); break;
      case 'settingsP': U.settingsBack = 'pause'; show('settings'); break;
      case 'pause': show('pause'); break;
      case 'resume': hide(); $('pauseBtn').hidden = false; Game.resume(); break;
      case 'restart': hide(); buildControls(Game.cfg.mode); $('controls').hidden = false; Game.restart(); break;
      case 'quit': Game.quit(); break;
      case 'mute': S().settings.muted = !S().settings.muted; Snd.apply(S().settings); Store.save(); show('settings'); break;
      case 'resetsave': { const b = $('rs'); if (b.dataset.arm) { Store.reset(); Snd.apply(S().settings); show('settings'); } else { b.dataset.arm = 1; b.textContent = '再点一次确认重置'; } break; }
      case 'create': case 'joinroom': {
        readOnline();
        if (!online.url) return err('请先填写服务器地址。');
        const code = ($('olCode').value || '').trim().toUpperCase();
        if (a === 'joinroom' && !/^[0-9A-Z]{6}$/.test(code)) return err('请输入 6 位联机密码（0-9、A-Z）。');
        online.busy = true; err(''); online.busy = true;
        $('olErr').textContent = '正在连接服务器……';
        MP.connect(online.url).then(() => { if (a === 'create') MP.create(online.mode, online.name); else MP.join(code, online.name); })
          .catch(e => err(e.message));
        break;
      }
      case 'olready': { const p = MP.S.players[MP.S.slot]; MP.ready(!(p && p.ready)); break; }
      case 'olstart': MP.start(); break;
      case 'olleave': MP.leaveRoom(); online.err = ''; show('online'); break;
      case 'backlobby': Game.quit(); if (MP.S.code) show('lobby'); else show('menu'); break;
    }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-mode],[data-diff],[data-omode],[data-badge],[data-tog]');
    if (!t || !scr.contains(t) && t.id !== 'rotOk' && !t.closest('#netbar')) return;
    click();
    if (t.dataset.go) go(t.dataset.go);
    else if (t.dataset.mode) { sel.mode = t.dataset.mode; show('mode'); }
    else if (t.dataset.diff) { S().settings.diff = +t.dataset.diff; Store.save(); show('mode'); }
    else if (t.dataset.omode) { readOnline(); online.mode = t.dataset.omode; show('online'); }
    else if (t.dataset.badge) { const b = Prog.BADGES.find(x => x.id === t.dataset.badge), g = S().badges[b.id]; $('badgeInfo').textContent = `${b.name}：${b.desc}　进度 ${Prog.progress(b)} / ${b.goal}　${g ? '获得日期 ' + new Date(g.ts).toLocaleDateString() : '（未获得）'}`; }
    else if (t.dataset.tog) { const k = t.dataset.tog; S().settings[k] = !S().settings[k]; Snd.apply(S().settings); Store.save(); show('settings'); }
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.vol; if (!k) return;
    S().settings[k] = e.target.value / 100; Snd.apply(S().settings); Store.save();
  });
  $('pauseBtn').addEventListener('click', () => { click(); Game.pause(); });
  $('tutSkip').addEventListener('click', () => { click(); Game.skipTutorial(); });
  $('rotOk').addEventListener('click', () => { $('rotate').classList.remove('show'); });

  // ---------- 教学提示 / Toast / 联机提示条 ----------
  U.tutorial = i => { const t = $('tut'); if (i < 0) { t.hidden = true; return; } t.hidden = false; $('tutText').textContent = Game.tutText(i); };
  U.toast = (title, sub) => {
    const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = esc(title) + (sub ? '<br>' + esc(sub) : '');
    $('stage').appendChild(d); setTimeout(() => d.remove(), 3200);
  };
  const netbar = $('netbar');
  function netMsg(html) { netbar.hidden = !html; netbar.innerHTML = html || ''; }

  // ---------- 联机回调 ----------
  MP.on.joined = () => { online.busy = false; online.err = ''; show('lobby'); };
  MP.on.room = () => { if (cur === 'lobby') show('lobby'); };
  MP.on.error = m => { online.busy = false; if (cur === 'lobby' || cur === 'online') { online.err = m; const e = $('olErr'); if (e) e.textContent = m; if (cur === 'online') show('online'); } else U.toast(m); };
  MP.on.start = info => {
    online.err = ''; netMsg('');
    hide(); $('controls').hidden = false; buildControls('online');
    Game.start({ mode: 'online', online: info });
  };
  MP.on.resume = () => {};
  MP.on.peer = (status, slot) => {
    if (status === 'disconnected') netMsg('玩家已断线。等待重新连接……');
    else if (status === 'selfDisconnected') netMsg('与服务器断开，正在重新连接……');
    else if (status === 'back') netMsg('');
    else if (status === 'left') {
      const host = MP.S.host === MP.S.slot;
      netMsg('玩家离开了房间。' + (host ? '<button class="btn sm" data-go="olabort">重新开始</button>' : '') + '<button class="btn sm" data-go="olleave2">退出房间</button>');
    }
  };
  MP.on.closed = () => { netMsg(''); Game.quit(); online.err = '与服务器的连接已断开。'; show('online'); };
  netbar.addEventListener('click', e => {
    const a = e.target.dataset.go;
    if (a === 'olabort') { MP.abort(); netMsg(''); Game.quit(); show('lobby'); }
    if (a === 'olleave2') { MP.leaveRoom(); netMsg(''); Game.quit(); show('menu'); }
  });

  // ---------- 触控按键 ----------
  const BTNS = [
    ['left', '◀', 'mv', 'tl'], ['right', '▶', 'mv', 'tr'], ['kick', '⚽ 踢球', 'k-kick'], ['bear', '🐻 抖毛', 'k-bear'], ['wobble', '🧠 摇头', 'k-wobble'], ['special', '✦<br>SUPER', 'sup'],
    ['dodgeL', '← 闪身', 'dg'], ['dodgeR', '闪身 →', 'dg'], ['mud', '👣 拔泥', 'k-mud'], ['shuffle', '🧺 簸箕', 'k-shuffle'], ['taunt', '😜 嘲讽', 'k-taunt']
  ];
  function padHtml(p, small) {
    return `<div class="pad ${small ? 'p2' : ''}" data-pad="${p}">` + BTNS.map(b => `<button class="btn ${b[2]}" data-k="${b[0]}" data-p="${p}" ${b[3] ? `data-hold="${b[3]}"` : ''}>${b[1]}<span class="cd"></span></button>`).join('') + '</div>';
  }
  function buildControls(mode) { $('controls').innerHTML = mode === 'local2p' ? padHtml(0, true) + padHtml(1, true) : padHtml(0, false); }
  const ctl = $('controls');
  ctl.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    e.preventDefault(); b.classList.add('down'); Snd.init();
    const p = +b.dataset.p;
    if (b.dataset.hold) { Game.hold(p, b.dataset.hold, true); try { b.setPointerCapture(e.pointerId); } catch (x) {} } else Game.press(p, b.dataset.k);
  });
  const up = e => { const b = e.target.closest && e.target.closest('[data-k]'); if (!b) return; b.classList.remove('down'); if (b.dataset.hold) Game.hold(+b.dataset.p, b.dataset.hold, false); };
  ctl.addEventListener('pointerup', up); ctl.addEventListener('pointercancel', up); ctl.addEventListener('lostpointercapture', up);
  ctl.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- 每帧：冷却显示、预览动画 ----------
  const prevT = { t: 0 };
  const PREV = { dodge: ['dodge', 0.45], kick: ['kick', 0.9], bear: ['bear', 1.3], wobble: ['wobble', 1.8], mud: ['mud', 1.4], shuffle: ['shuffle', 1.2] };
  const dummy = Eng.mkF({ id: 9, team: 0, ctl: 'demo', pal: Draw.PAL.p, x: 0 });
  U.frame = dt => {
    prevT.t += dt;
    if (cur === 'skills') {
      const main = Draw.getCtx();
      scr.querySelectorAll('canvas[data-prev]').forEach(cv => {
        const [state, dur] = PREV[cv.dataset.prev], g = cv.getContext('2d');
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 150, 170);
        const s = 0.55; g.setTransform(s, 0, 0, s, 75, 160 - Draw.GROUND * s);
        dummy.state = state; dummy.dur = dur; dummy.st = prevT.t % (dur + 0.5); if (dummy.st > dur) dummy.state = 'idle'; dummy.clock = prevT.t; dummy.dir = 1; dummy.facing = 1; dummy.x = 0;
        Draw.setCtx(g); Draw.fighter(dummy);
      });
      Draw.setCtx(main);
    }
    const me = G.me;
    if (!ctl.hidden && me) {
      ctl.querySelectorAll('[data-k]').forEach(b => {
        const f = +b.dataset.p === 0 ? G.me : G.p2; if (!f) return;
        const k = b.dataset.k, ck = k === 'dodgeL' || k === 'dodgeR' ? 'dodge' : k;
        const cd = ['dodge', 'kick', 'bear', 'wobble', 'mud', 'shuffle', 'taunt'].includes(ck) ? Math.max(0, f.cool[ck] || 0) : 0;
        const label = cd > 0.05 ? Math.ceil(cd) + '' : '';
        const span = b.lastChild;
        if (span.textContent !== label) span.textContent = label;
        b.classList.toggle('ready', k === 'special' && f.energy >= 100);
      });
    }
  };

  // ---------- 游戏阶段回调 ----------
  Game.onPhase = ph => {
    if (ph === 'fight' || ph === 'intro') { $('pauseBtn').hidden = false; if (cur === 'pause') hide(); }
    if (ph === 'pause') show('pause');
    if (ph === 'menu') { $('controls').hidden = true; $('pauseBtn').hidden = true; $('tut').hidden = true; netMsg(''); show('menu'); }
    if (ph === 'ko') $('pauseBtn').hidden = true;
  };
  Game.onEnd = r => { lastRes = r; $('pauseBtn').hidden = true; setTimeout(() => show('result'), 100); };

  U.boot = () => {
    Store.load();
    Snd.apply(S().settings);
    online.url = S().server || ''; online.name = '玩家' + Math.floor(Math.random() * 90 + 10);
    Game.boot(); show('menu');
    // 首次点击后解锁音频（浏览器要求用户手势）
    document.addEventListener('pointerdown', () => Snd.init(), { once: true });
  };
  return U;
})();
document.getElementById('c') && UI.boot();

</script>

</body></html>
