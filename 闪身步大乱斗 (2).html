<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>闪身步大乱斗</title>
<style>
:root{--ink:#1b1a22;--paper:#fffdf2;--orange:#f2602a;--yellow:#ffe14a;--sky:#6aaee3;--mint:#8fe08a}
html,body{height:100%;margin:0}
body{background:#14202e;color:#fff;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0f1822;border-radius:10px;overflow:hidden;margin-top:6px}
#c{width:100%;height:100%;object-fit:contain;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(14,24,36,.55);text-align:center;padding:12px;box-sizing:border-box;overflow:auto}
.overlay[hidden],[hidden]{display:none!important}
h1{margin:0;font-size:clamp(30px,7vw,76px);font-weight:900;color:#ffe14a;-webkit-text-stroke:2px #1b1a22;text-shadow:0 6px 0 #f2602a,0 10px 0 #1b1a22;letter-spacing:.04em;line-height:1.1}
.tag{font-size:clamp(13px,2.4vw,20px);font-weight:900;color:#fff;text-shadow:0 2px 0 #1b1a22;letter-spacing:.08em}
.big{font-size:clamp(20px,4vw,34px);font-weight:900;color:#fff;text-shadow:0 3px 0 #1b1a22}
.btn{font:inherit;font-weight:900;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:none;padding:8px 16px;min-height:44px;font-size:clamp(14px,2.4vw,19px)}
.btn:active,.btn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.on{background:var(--orange);color:#fff;text-shadow:0 1px 0 var(--ink)}
.btn.hero{background:var(--orange);color:#fff;font-size:clamp(18px,3.4vw,28px);padding:12px 34px;text-shadow:0 2px 0 var(--ink)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(150px,230px));gap:10px 14px}
.menu .btn{text-align:left;padding:10px 16px}.menu .btn.hero{grid-column:1/-1;text-align:center}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;width:min(760px,96%);max-height:96%;overflow:auto;text-align:left;box-sizing:border-box}
.panel h2{margin:0;font-size:22px}.panel h3{margin:4px 0 0;font-size:15px;opacity:.7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900;font-size:17px;flex-wrap:wrap}
.row input[type=range]{flex:1;min-width:120px;max-width:260px}
.inp{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;min-height:20px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.code{font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:.2em;color:var(--orange);text-align:center;font-family:ui-monospace,Menlo,monospace}
.err{color:#c62d1f;font-weight:900;min-height:1.2em}.note{font-size:13px;opacity:.75;font-weight:700;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:3px solid var(--ink);border-radius:14px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:4px;cursor:pointer;font-weight:900;font-size:14px}
.card.locked{filter:grayscale(1);opacity:.55}.card .ic{font-size:30px}.card small{font-weight:700;opacity:.7}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#e6e1cf;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}
.skill{display:grid;grid-template-columns:150px 1fr;gap:10px;border:3px solid var(--ink);border-radius:14px;padding:8px;background:#fff;font-weight:700;font-size:14px;line-height:1.5}
.skill canvas{width:150px;height:170px;background:linear-gradient(#a9d6f5,#6aaee3);border-radius:10px}
.slot{display:flex;justify-content:space-between;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:900;background:#fff}
.slot.empty{opacity:.45}.ok{color:#2a9d3f}.wait{color:#999}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-weight:900}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fffdf2;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;font-weight:900;z-index:20;box-shadow:0 5px 0 var(--ink);text-align:center}
#tut{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(255,253,242,.96);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:900;z-index:15;display:flex;gap:12px;align-items:center;max-width:92%;font-size:clamp(14px,2.4vw,20px)}
#netbar{position:absolute;top:112px;left:50%;transform:translateX(-50%);z-index:16;background:#c62d1f;color:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.corner{position:absolute;top:8px;right:8px;z-index:5;width:46px;height:46px;padding:0;font-size:20px;border-radius:12px}
#controls{display:flex;gap:10px;height:28vh;min-height:118px;max-height:215px;padding:8px 0 10px;box-sizing:border-box}
.pad{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:6px;min-width:0}
.pad .btn{padding:2px;min-height:0;font-size:clamp(11px,2.1vh,18px);position:relative;line-height:1.15;touch-action:none}
.pad .sup{grid-column:6;grid-row:1/3;background:#ff9ee0}.pad .sup.ready{animation:pulse .6s infinite alternate}
.pad .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5em;color:#fff;text-shadow:0 2px 0 #000;background:rgba(20,30,45,.55);border-radius:10px;pointer-events:none}
.pad .cd:empty{display:none}
.pad.p2 .btn{font-size:clamp(10px,1.7vh,15px)}
.pad .mv{background:#d9e8f5}.pad .dg{background:#bfe4ff}.pad .k-kick{background:#ffd34d}.pad .k-bear{background:#ffb08a}.pad .k-wobble{background:#c9f0c0}.pad .k-mud{background:#d7c4a0}.pad .k-shuffle{background:#b8e2ff}.pad .k-taunt{background:#f5d0ff}
@keyframes pulse{to{transform:scale(1.05);box-shadow:0 5px 0 var(--ink),0 0 18px #ff9ee0}}
#rotate{position:fixed;inset:0;background:#14202e;z-index:99;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-align:center;padding:24px}
@media (orientation:portrait) and (max-width:900px){#rotate.show{display:flex}.menu{grid-template-columns:1fr}#controls{height:34vh}.skill{grid-template-columns:1fr}}
</style>
<div id="app">
  <div id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <button class="btn corner" id="pauseBtn" aria-label="暂停" hidden>⏸</button>
    <div id="tut" hidden><span id="tutText"></span><button class="btn sm" id="tutSkip">跳过教学</button></div>
    <div id="netbar" hidden></div>
    <div class="overlay" id="scr"></div>
  </div>
  <div id="controls" hidden></div>
</div>
<div id="rotate" class="show"><div>请横向使用设备 ↻</div><button class="btn" id="rotOk">仍然竖屏游玩</button></div>

    SKILL_KEYS.forEach(k => { skills[k] = { lv: 1, xp: 0 }; });
    return {
      v: 1,
      player: { lv: 1, xp: 0 },
      skills,
      badges: {},
      stats: { dodge: 0, perfect: 0, perfectBest: 0, kickHit: 0, kickStreakBest: 0, wobble: 0, mud: 0, bear: 0, shuffle: 0,
        wins: 0, losses: 0, matches: 0, dbWins: 0, mpWins: 0, maxCombo: 0, damage: 0, superFlash: 0, masterWins: 0, bounceBest: 0 },
      settings: { master: 0.8, music: 0.6, sfx: 1, voice: 1, muted: false, musicOn: true, sfxOn: true, voiceOn: true, diff: 1, mode: 'ai' },
      tutorialDone: false,
      server: ''
    };
  }

  const num = (v, d, min, max) => { v = Number(v); return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : d; };
  const bool = (v, d) => (typeof v === 'boolean' ? v : d);

  // 逐字段校验，任何异常字段回退为默认值
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('bad');
    const d = def();
    d.player.lv = Math.floor(num(raw.player && raw.player.lv, 1, 1, 999));
    d.player.xp = Math.floor(num(raw.player && raw.player.xp, 0, 0, 1e9));
    SKILL_KEYS.forEach(k => {
      const s = raw.skills && raw.skills[k];
      d.skills[k].lv = Math.floor(num(s && s.lv, 1, 1, 10));
      d.skills[k].xp = Math.floor(num(s && s.xp, 0, 0, 1e6));
    });
    for (const k in d.stats) d.stats[k] = Math.floor(num(raw.stats && raw.stats[k], 0, 0, 1e9));
    if (raw.badges && typeof raw.badges === 'object') {
      for (const id in raw.badges) { const b = raw.badges[id]; if (b && Number.isFinite(b.ts)) d.badges[String(id).slice(0, 30)] = { ts: b.ts }; }
    }
    const s = raw.settings || {};
    ['master', 'music', 'sfx', 'voice'].forEach(k => { d.settings[k] = num(s[k], d.settings[k], 0, 1); });
    ['muted', 'musicOn', 'sfxOn', 'voiceOn'].forEach(k => { d.settings[k] = bool(s[k], d.settings[k]); });
    d.settings.diff = Math.floor(num(s.diff, 1, 0, 3));
    d.settings.mode = ['ai', 'double', 'local2p', 'village'].includes(s.mode) ? s.mode : 'ai';
    d.tutorialDone = bool(raw.tutorialDone, false);
    d.server = typeof raw.server === 'string' ? raw.server.slice(0, 120) : '';
    return d;
  }

  const store = { data: def(), recovered: false, ok: true };

  store.load = () => {
    let text = null;
    try { text = localStorage.getItem(KEY); } catch (e) { store.ok = false; }
    if (!text) return store.data;
    try {
      store.data = sanitize(JSON.parse(text));
    } catch (e) {
      store.data = def();
      store.recovered = true;
      store.flush();
    }
    return store.data;
  };
  store.flush = () => {
    try { localStorage.setItem(KEY, JSON.stringify(store.data)); store.ok = true; } catch (e) { store.ok = false; }
  };
  store.save = () => {
    if (timer) return;
    timer = setTimeout(() => { timer = null; store.flush(); }, 400);
  };
  store.reset = () => { store.data = def(); store.flush(); };

  window.addEventListener('pagehide', () => store.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) store.flush(); });
  return store;
})();
